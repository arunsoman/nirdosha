---
# Source: nirdosha/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nirdosha-nirdosha
  labels:
    app.kubernetes.io/name: nirdosha
    app.kubernetes.io/instance: nirdosha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: nirdosha-0.1.0
spec:
  serviceName: nirdosha-nirdosha
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nirdosha
      app.kubernetes.io/instance: nirdosha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nirdosha
        app.kubernetes.io/instance: nirdosha
    spec:
      serviceAccountName: nirdosha-nirdosha
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: nirdosha
          image: "ghcr.io/protobox/nirdosha-runtime:latest"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /data/app.nir
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --transact-log
            - /data/nirdosha.transact.db
            - --workflow-log
            - /data/nirdosha.workflow.db
            - --theme
            - /data/theme.json
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Doubles as the startup probe (KUBERNETES.md: "same route as
            # readiness, with a longer failureThreshold, works as a startup
            # probe") -- a generous budget for schema migration + crash
            # replay to finish before the Pod is ever marked NotReady long
            # enough to be killed.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

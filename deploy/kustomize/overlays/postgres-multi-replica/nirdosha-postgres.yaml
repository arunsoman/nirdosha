---
# Source: nirdosha/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nirdosha-nirdosha
  labels:
    app.kubernetes.io/name: nirdosha
    app.kubernetes.io/instance: nirdosha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: nirdosha-0.2.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nirdosha
      app.kubernetes.io/instance: nirdosha
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Rolling restarts must never take every replica down at once --
      # the whole reason >1 replica was requested.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nirdosha
        app.kubernetes.io/instance: nirdosha
    spec:
      serviceAccountName: nirdosha-nirdosha
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: nirdosha
          image: "ghcr.io/protobox/nirdosha-runtime:latest"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /data/app.nir
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --transact-log
            - $(TRANSACT_LOG_URL)
            - --workflow-log
            - $(WORKFLOW_LOG_URL)
            - --theme
            - /data/theme.json
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRANSACT_LOG_URL
              valueFrom:
                secretKeyRef:
                  name: nirdosha-postgres
                  key: transact-log-url
            - name: WORKFLOW_LOG_URL
              valueFrom:
                secretKeyRef:
                  name: nirdosha-postgres
                  key: workflow-log-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Doubles as the startup probe (KUBERNETES.md: "same route as
            # readiness, with a longer failureThreshold, works as a startup
            # probe") -- a generous budget for schema migration + crash
            # replay to finish before the Pod is ever marked NotReady long
            # enough to be killed.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}

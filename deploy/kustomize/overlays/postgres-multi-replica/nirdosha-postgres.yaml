metadata:
  name: nirdosha-nirdosha
  labels:
    app.kubernetes.io/name: nirdosha
    app.kubernetes.io/instance: nirdosha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: nirdosha-0.2.0

# Default values for the nirdosha chart — see KUBERNETES.md for the
# compliance matrix every default below traces back to.

image:
  # Unpublished as of this chart's first version — KUBERNETES.md P0's
  # first item. Build+push it from the repo root Dockerfile, or point
  # this at your own derived image (base image + your .nir source
  # COPY'd in, same shape `plugins/deploy_targets/kubernetes.py`'s
  # `_derived_dockerfile` synthesizes on protobox's side).
  repository: ghcr.io/protobox/nirdosha-runtime
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# The single .nir entrypoint this release serves. Required — there is no
# sensible default (KUBERNETES.md: one process, one file per `serve`
# invocation).
entrypointFile: "app.nir"

# `.nir` has no runtime env-var read (`db_connect(...)` is a literal
# compiled into the source itself, KUBERNETES.md's "State, data &
# horizontal scaling" row) — replicas > 1 is refused by this chart's own
# templates (see statefulset/deployment .tpl logic) unless
# db.mode=postgres, matching `kubernetes.py::render_manifests`'s own
# ValueError guard on the protobox side. `sqlite` -> a StatefulSet + one
# PVC, exactly one replica. `postgres` -> a plain Deployment, any replica
# count, but you must ALSO point --transact-log/--workflow-log at
# Postgres yourself by pre-generating a program whose db_connect(...)
# literal is already a postgres:// URL (this chart cannot rewrite your
# .nir source for you) and set db.postgresSecretName below.
db:
  mode: sqlite # sqlite | postgres
  postgresSecretName: ""
  storage:
    size: 1Gi
    storageClassName: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
  host: ""
  tls:
    enabled: true
    secretName: ""

# Auth (`--jwks-file`/`--issuer`/`--audience`) — all three, or none.
auth:
  enabled: false
  jwksSecretName: ""
  issuer: ""
  audience: ""

# `--presence-token-file`/`--otel-token-file` — Secret-mounted, never a
# bare CLI value (KUBERNETES.md's "Secrets sourced from files, not bare
# CLI values" row; this same compliance change added the -file flags).
#
# Setting `presence.enabled: true` alone used to be a silent trap: it
# wired `--presence-token-file` onto the `nirdosha` container so
# `notify()`'s presence routes stopped 404ing, but nothing in this chart
# ever deployed the WebSocket gateway (`presence-gateway/`, repo root)
# those routes exist *for* — `identity_presence` would still never gain
# an "online" row, so `notify()` still always silently took the offline
# path, just with no error anywhere to say so (ROADMAP.md Track A5's own
# "this doesn't error, it just never does the push-it-live half of its
# job" framing, reproduced one layer up in this chart). `presence.enabled`
# now deploys the gateway as a sidecar in the same Pod (`_pod.tpl`) —
# same "one Pod, no separate service to keep in sync" shape this chart
# already takes for the app's own UI+API — reusing the *same*
# `auth.jwksSecretName`/`issuer`/`audience` the main container validates
# against (it's the same identity provider issuing the same bearer
# tokens; nothing to duplicate). `presence.enabled: true` therefore
# requires `auth.enabled: true` too — validated at render time
# (`_helpers.tpl::nirdosha.validatePresence`), the same "fail loudly, not
# silently misconfigured" posture `validateReplicaMode` already takes for
# `db.mode`.
presence:
  enabled: false
  tokenSecretName: ""
  gateway:
    image:
      repository: ghcr.io/protobox/nirdosha-presence-gateway
      tag: latest
      pullPolicy: IfNotPresent
    # The WS gateway's own listen port inside the Pod — distinct from the
    # main container's 8080, exposed as a second port on the same
    # Service (`service.yaml`) so a browser reaches it at
    # `ws://<service>:<gatewayPort>/ws`.
    port: 8090
  # Redis is where `notify()`'s live-push events actually flow
  # (`nirdosha:push:<subject>`, WORKFLOW.md's presence-bridge section) —
  # a separate, already-running Redis this chart does not deploy for you
  # (the same "bring your own Postgres" posture `db.postgresSecretName`
  # already takes for `db.mode=postgres`). Required when `presence.enabled`.
  redis:
    host: ""
    port: 6379

otel:
  enabled: false
  port: 4319
  tokenSecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# KUBERNETES.md's "Security posture" row / P3's "Pod Security
# 'restricted' profile" item.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 10001

# Durability (Track A1) already survives a hard SIGKILL; the graceful
# SIGTERM handler this compliance change adds drains within its ~200ms
# poll interval, so this is a safety margin, not load-bearing.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

{{- include "nirdosha.validateReplicaMode" . -}}
{{- if eq .Values.db.mode "sqlite" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nirdosha.fullname" . }}
  labels:
    {{- include "nirdosha.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nirdosha.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "nirdosha.selectorLabels" . | nindent 6 }}
  template:
    {{- include "nirdosha.podTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.db.storage.storageClassName }}
        storageClassName: {{ .Values.db.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
{{- end }}

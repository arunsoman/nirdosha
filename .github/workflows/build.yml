name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (clang, z3)
        run: sudo apt-get update && sudo apt-get install -y clang libz3-dev
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build
        working-directory: crates/compiler
        run: cargo build --release

  # macOS didn't get a CI job of its own until now — it was only ever
  # actually built when a `v*` tag triggered release.yml, so a regular
  # push/PR to `main` could break macOS and nothing here would notice
  # until release time. This job mirrors release.yml's macOS leg exactly:
  # same runner (macos-14, the aarch64-apple-darwin leg there), same
  # `brew install z3` + non-`dist` (system Z3, not vendored) build --
  # `z3-src` 416.0.2 fails to compile against the AppleClang on GitHub's
  # macos-13/macos-14 runners (see release.yml's header comment), so this
  # job deliberately does NOT pass `--features dist` here either. No
  # `Z3_SYS_Z3_HEADER`/similar env var is set because release.yml doesn't
  # set one either -- the `z3` crate finds Homebrew's system Z3 (headers +
  # lib) on its own once it's installed.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install system Z3 (see workflow header)
        run: brew install z3
      - name: Install and start Redis (mq_connect/mq_publish/mq_consume tests)
        # tests/mq.rs's own header comment: needs a real Redis at
        # 127.0.0.1:6379, no auth. Unlike Postgres's own integration
        # tests (#[ignore]d, opt-in via NIRDOSHA_TEST_POSTGRES_URL),
        # mq.rs's tests run unconditionally -- this job is the first CI
        # job that ever runs the full `cargo test --release` (see this
        # workflow's own build-macos header comment), which is what
        # surfaced the gap: without this step, every mq.rs test fails
        # with "Connection refused" instead of exercising real behavior.
        run: |
          brew install redis
          brew services start redis
          for i in $(seq 1 10); do redis-cli ping && break; sleep 1; done
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build (macOS — system Z3, see workflow header)
        working-directory: crates/compiler
        run: cargo build --release
      - name: Run the test suite
        working-directory: crates/compiler
        run: cargo test --release

  # Windows didn't get a CI job of its own until now — the release
  # workflow's `x86_64-pc-windows-msvc` leg was the only thing that ever
  # actually compiled this crate for Windows, and it was failing outright
  # (`std::os::unix::net::{UnixListener, UnixStream}` used unconditionally
  # in `interpreter.rs`'s sandbox-channel transport — Unix-only in std,
  # so it doesn't even exist on the `windows` target; the `tcp`/
  # `tcp_listener` runtime's own `RawFd`→`RawSocket` port was already
  # correct). See docs/ROADMAP.md A7. Fixed by giving that transport a real
  # `#[cfg(windows)]` leg (a loopback TCP socket, since std doesn't wrap
  # `AF_UNIX` for Windows) instead of leaving Windows uncompilable — this
  # job is what actually proves the fix, and what would have caught the
  # original break before it shipped: build for real, then run every
  # integration test that exercises the ported code end to end (`tcp`:
  # the raw-handle codegen path from runtime_kernels.rs; `sandbox`/
  # `sandbox_channels`/`channels`: the loopback-socket transport this fix
  # added). `--features dist` vendors Z3 from source (same as
  # release.yml) so this job needs no system `libz3` install on Windows.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build (Z3 vendored, no system libz3 dependency)
        working-directory: crates/compiler
        run: cargo build --release --features dist
      - name: Run the tcp / sandbox-channel integration tests
        working-directory: crates/compiler
        run: cargo test --release --features dist --test tcp --test sandbox --test sandbox_channels --test channels
      - name: Run the compiled (native-codegen) tcp/tcp_listener tests
        # These are the ones that actually exercise runtime_kernels.rs's
        # RawSocket path -- they compile real .nir source to a native
        # binary via `clang` (preinstalled on windows-latest) and run it,
        # not just the interpreter. Filtered out of the rest of
        # `codegen.rs`'s ~140 tests to keep this job fast; nothing else
        # in that file touches the platform-conditional socket code.
        working-directory: crates/compiler
        run: cargo test --release --features dist --test codegen -- compiled_connect compiled_listen compiled_recv connecting_to_a_closed_port_traps_at_runtime tcp_client_example

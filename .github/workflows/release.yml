name: release

# Builds prebuilt `nirdosha` binaries and attaches them to a GitHub
# Release whenever a `v*` tag is pushed. Z3 is statically vendored (the
# `dist` feature, see crates/compiler/Cargo.toml) on Linux/Windows, so those
# binaries need no system `libz3` — `clang` is still required on the
# *user's* machine at runtime, but only for `nirdosha build`/`emit-llvm`
# (native codegen); interpreting, `emit-ast`, `emit-ui`, and `serve` all
# work with zero extra system deps.
#
# macOS is the one disclosed exception: `z3-src` 416.0.2 (the version
# the current `z3` 0.20.2 crate pulls) fails to compile against the
# AppleClang shipped on GitHub's macos-13/macos-14 runners (a real
# upstream `obj_hashtable.h` constructor-strictness incompatibility,
# confirmed 2026-08-25 on this workflow's first real run — not a config
# mistake). Until a newer `z3`/`z3-src` release fixes this upstream,
# macOS builds link the *system* Z3 (via Homebrew) instead of vendoring
# it — so the macOS binary needs `brew install z3` on the machine that
# runs it, same as building from source would. Documented, not silent.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: nirdosha-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            asset: nirdosha-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            asset: nirdosha-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nirdosha-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install system Z3 (macOS only — see workflow header)
        if: runner.os == 'macOS'
        run: brew install z3

      - name: Build (Z3 vendored, no system libz3 dependency)
        if: runner.os != 'macOS'
        working-directory: crates/compiler
        run: cargo build --release --features dist --target ${{ matrix.target }}

      - name: Build (macOS — system Z3, see workflow header)
        if: runner.os == 'macOS'
        working-directory: crates/compiler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble Nirdosha.app (macOS icon/file-association registrar)
        # Only once, not once per macOS arch matrix leg — see
        # assets/macos/Nirdosha.app/Contents/Info.plist's own comment for
        # why this needs a real app bundle at all, and why `iconutil`/`cc`
        # (native-macOS-only, unavailable in a Linux dev sandbox) are the
        # reason this step lives here instead of being committed pre-built.
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -eu
          bundle=Nirdosha.app
          rm -rf "$bundle"
          cp -R assets/macos/Nirdosha.app "$bundle"
          mkdir -p "$bundle/Contents/Resources"
          iconutil -c icns assets/brand/nirdosha.iconset -o "$bundle/Contents/Resources/nirdosha.icns"
          cc -O2 -o "$bundle/Contents/MacOS/nirdosha-launcher" assets/macos/nirdosha-launcher.c
          chmod +x "$bundle/Contents/MacOS/nirdosha-launcher"
          plutil -lint "$bundle/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" nirdosha-icon-registrar-macos.zip
          shasum -a 256 nirdosha-icon-registrar-macos.zip > nirdosha-icon-registrar-macos.zip.sha256

      - name: Package (Unix)
        # Linux tarballs also carry the icon-theme PNGs + shared-mime-info
        # XML (assets/linux/, assets/brand/linux-icons/) so
        # scripts/install.sh's Linux branch can register the .nir file
        # icon from what it already downloaded — the curl-one-liner
        # install never clones this repo, so anything install.sh needs at
        # install time has to ship IN the release asset, not just live in
        # git. macOS gets no extra payload here — see the separate
        # Nirdosha.app registrar asset/step above for how macOS gets its
        # icon association instead (a different mechanism entirely,
        # Launch Services, not an icon-theme directory).
        if: runner.os != 'Windows'
        working-directory: crates/compiler
        run: |
          stage=$(mktemp -d)
          cp ../../target/${{ matrix.target }}/release/nirdosha "$stage/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -r ../../assets/brand/linux-icons "$stage/linux-icons"
            cp ../../assets/linux/nirdosha-mime.xml "$stage/nirdosha-mime.xml"
          fi
          tar czf ../../${{ matrix.asset }} -C "$stage" .
          rm -rf "$stage"
          cd ../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi

      - name: Package (Windows)
        # Bundles nirdosha.ico alongside nirdosha.exe so
        # scripts/install.ps1 can register the .nir file icon from what
        # it already downloaded — same "install.ps1 never clones this
        # repo" reasoning as the Unix step above.
        if: runner.os == 'Windows'
        working-directory: crates/compiler
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "nirdosha-pkg-$([guid]::NewGuid())")
          Copy-Item ../../target/${{ matrix.target }}/release/nirdosha.exe $stage
          Copy-Item ../../assets/brand/nirdosha.ico $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath ../../${{ matrix.asset }}
          Remove-Item -Recurse -Force $stage
          cd ../..
          Get-FileHash ${{ matrix.asset }} -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Smoke test the built binary
        if: runner.os != 'Windows'
        run: |
          chmod +x target/${{ matrix.target }}/release/nirdosha
          target/${{ matrix.target }}/release/nirdosha crates/compiler/tests/fixtures/hello.nir

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      - name: Upload Nirdosha.app (icon/file-association registrar)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nirdosha-icon-registrar-macos.zip
            nirdosha-icon-registrar-macos.zip.sha256

name: release

# Builds prebuilt `nirdosha` binaries and attaches them to a GitHub
# Release whenever a `v*` tag is pushed. Z3 is statically vendored (the
# `dist` feature, see compiler/Cargo.toml) so the shipped binary needs no
# system `libz3` — `clang` is still required on the *user's* machine at
# runtime, but only for `nirdosha build`/`emit-llvm` (native codegen);
# interpreting, `emit-ast`, `emit-ui`, and `serve` all work with zero
# extra system deps.
#
# macOS and Windows jobs are unverified until this workflow's first real
# run on a tag — only the Linux x86_64 build has been smoke-tested
# locally (a `cargo build --release --features dist` on this machine).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: nirdosha-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            asset: nirdosha-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            asset: nirdosha-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nirdosha-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Build (Z3 vendored, no system libz3 dependency)
        working-directory: compiler
        run: cargo build --release --features dist --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: compiler
        run: |
          tar czf ../${{ matrix.asset }} -C target/${{ matrix.target }}/release nirdosha
          cd ..
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: compiler
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/nirdosha.exe -DestinationPath ../${{ matrix.asset }}
          cd ..
          Get-FileHash ${{ matrix.asset }} -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Smoke test the built binary
        if: runner.os != 'Windows'
        run: |
          chmod +x compiler/target/${{ matrix.target }}/release/nirdosha
          compiler/target/${{ matrix.target }}/release/nirdosha examples/hello.nir

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

<!--
  Generated by `nirdosha emit-ui`. Styled with the Nirdosha brand token
  set (2026-08-27 — derived from `assets/brand/nirdosha-logo.png`'s
  navy/amber mark, replacing the previous generic Material Design 3
  defaults). `--md-*` custom-property *names* are kept as-is (every rule
  below still reads them) -- only their default *values* changed, so a
  per-project `--theme` file's overrides (`ui_gen.rs::theme_override_css`)
  keep working unmodified. IBM Plex Sans/Mono are the one deliberate
  network dependency this template takes on by default (a programming-
  language brand's own type family has no system-font equivalent to fall
  back to losslessly) -- `--font-sans`'s own fallback stack still
  degrades to a plain system sans-serif if the fetch fails, never a blank
  page. The favicon/app-bar mark are both the same brand icon, inlined as
  `data:` URIs at compile time (`ui_gen.rs::favicon_data_uri`/
  `logo_data_uri`) -- no separate asset file ships with a generated
  project, no *image* network fetch, nothing to opt into.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
__NIRDOSHA_THEME_SCRIPT__
<style>
  :root {
    --md-primary: #1f1a52;
    --md-on-primary: #ffffff;
    --md-primary-container: #e3e0f7;
    --md-on-primary-container: #1f1a52;
    --md-surface: #ffffff;
    --md-on-surface: #17142e;
    --md-surface-variant: #efedf7;
    --md-on-surface-variant: #5c5a78;
    --md-outline: #918eb0;
    --md-error: #c4433a;
    --md-on-error: #ffffff;
    --md-error-container: #fbe4e1;
    --md-background: #fbfaff;
    --md-elevation-1: 0 1px 2px rgba(31,26,82,.12), 0 1px 3px 1px rgba(31,26,82,.08);
    --md-elevation-2: 0 1px 2px rgba(31,26,82,.16), 0 2px 6px 2px rgba(31,26,82,.10);
    --md-radius-sm: 6px;
    --md-radius-md: 8px;
    --md-radius-lg: 8px;
    --md-font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* The one brand accent that stays byte-identical in light and dark
       (`assets/brand/nirdosha-icon.png`'s amber stripe, #f89a1c) --
       reserved for interactive/focus signaling specifically (nav's
       active-item marker, every `:focus-visible` ring), deliberately
       *not* a fill color anywhere -- restraint is the point: one accent,
       spent in one consistent role, not sprinkled decoratively. See
       `.nav-item.active`'s doc comment for the motif it's drawn from.
       `--brand-mono` is the second half of the two-role type system
       (`--font-sans` above is the first): IBM Plex Mono, used only where
       a value is literally code/data-shaped (the app-bar wordmark, a
       `dec128`-typed table column) -- a programming-language brand
       reaching for its own monospace family instead of Material's
       generic "everything is the same grotesque" stance. */
    --brand-accent: #f89a1c;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    /* Design-token defaults below match `DesignSpec`'s own defaults
       (radius=rounded, shadow=subtle, density=comfortable,
       motion=subtle, type_scale=default) -- a `.nir` app with no
       `--theme` at all renders identically to before these tokens
       existed; a theme file overrides only the sections it sets
       (`ui_gen.rs::theme_override_css`), everything else keeps these. */
    --radius-control: 6px;
    --radius-card: 10px;
    --shadow-card: 0 1px 2px 0 rgb(31 26 82 / 0.06);
    --density-card-padding: 24px;
    --density-gap: 16px;
    --density-control-height: 40px;
    --density-font-size: 14px;
    --font-sans: var(--md-font);
    --font-display: var(--md-font);
    --motion-interaction-ms: 150ms;
    --motion-entrance-ms: 200ms;
    --motion-easing: ease-out;
    --hover-lift-px: 2px;
    --hover-scale: 1;
    --press-scale: 0.95;
    --stagger-ms: 40;
    --title-px: 24px;
    --hero-px: 30px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #bab4ec;
      --md-on-primary: #1f1a52;
      --md-primary-container: #37316c;
      --md-on-primary-container: #e3e0f7;
      --md-surface: #121022;
      --md-on-surface: #e8e6f7;
      --md-surface-variant: #2a2650;
      --md-on-surface-variant: #a7a3c9;
      --md-outline: #6a6690;
      --md-error: #ffb4a8;
      --md-on-error: #5c130c;
      --md-error-container: #7a251b;
      --md-background: #0d0b1c;
    }
  }
  __NIRDOSHA_THEME_OVERRIDE__
  /* Fixed 4-name animation vocabulary (`DesignSpec.MOTION_ANIMATIONS`)
     -- no other `animate-*`-equivalent name exists in this template, by
     design (protobox's own contract: "no other animate-* names exist").
     `motion: none` needs no special-casing anywhere below: its
     `--motion-*-ms`/`--hover-*`/`--press-scale` values are all already
     zero/neutral (`MOTION_DURATIONS`/`MOTION_HOVER_*`/`MOTION_PRESS_
     SCALE`'s own "none" entries), so every transition/animation using
     them is naturally instant/absent without an `if` anywhere in CSS. */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scale-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.9); } 60% { opacity: 1; transform: scale(1.03); } 100% { transform: scale(1); } }
  .screen-enter { animation: fade-in var(--motion-entrance-ms) var(--motion-easing); }
  .row-enter { animation: slide-up var(--motion-entrance-ms) var(--motion-easing) both; }
  /* `prefers-reduced-motion` is honored globally, unconditionally --
     same posture protobox's own contract takes ("already handled
     globally -- never add your own reduced-motion CSS"): an author of a
     `.nir` app gets this for free, no DSL surface needed to opt in. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--md-font); background: var(--md-background);
    color: var(--md-on-surface); min-height: 100vh;
  }
  .app-bar {
    height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: var(--md-surface); border-bottom: 1px solid var(--md-surface-variant);
    position: sticky; top: 0; z-index: 10;
  }
  .app-bar-mark { border-radius: 6px; flex-shrink: 0; }
  .app-bar h1 {
    font-family: var(--font-mono); font-size: 19px; font-weight: 600; letter-spacing: -.01em;
    margin: 0; flex: 1;
  }
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .nav-rail {
    width: 220px; flex-shrink: 0; background: var(--md-surface);
    border-right: 1px solid var(--md-surface-variant); padding: 12px 8px;
    transition: width var(--motion-interaction-ms) var(--motion-easing);
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-radius: var(--md-radius-lg); cursor: pointer; font-size: 14px;
    font-weight: 500; color: var(--md-on-surface-variant); margin-bottom: 4px;
    border: none; background: none; width: 100%; text-align: left; font-family: inherit;
    transition: background-color var(--motion-interaction-ms) var(--motion-easing),
                color var(--motion-interaction-ms) var(--motion-easing),
                transform var(--motion-interaction-ms) var(--motion-easing);
  }
  .nav-item:hover { background: color-mix(in srgb, var(--md-primary) 8%, transparent); transform: translateY(calc(-1 * var(--hover-lift-px))); }
  .nav-item:active { transform: scale(var(--press-scale)); }
  .nav-item:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
  /* The signature element: a left-edge amber bracket, not a filled pill
     -- drawn from the brand mark's own curly-brace glyph
     (`assets/brand/nirdosha-logo.png`) rather than decoration for its
     own sake. `padding-left` drops by the border's own width so the
     label doesn't visibly shift when a nav item becomes active. */
  .nav-item.active {
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    border-left: 3px solid var(--brand-accent); padding-left: 13px;
  }
  main { flex: 1; padding: 24px 32px; max-width: 960px; }
  .screen-title { font-size: var(--title-px); font-weight: 400; margin: 0 0 4px; }
  .screen-sub { color: var(--md-on-surface-variant); font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--md-surface); border: 1px solid var(--md-surface-variant);
    border-radius: var(--radius-card); padding: var(--density-card-padding); margin-bottom: var(--density-gap);
    box-shadow: var(--shadow-card);
    transition: box-shadow var(--motion-interaction-ms) var(--motion-easing),
                transform var(--motion-interaction-ms) var(--motion-easing),
                border-color var(--motion-interaction-ms) var(--motion-easing);
  }
  /* 2026-08-27, default-style pass: every `.card` (a table wrapper, a
     dashboard tile, a chart) gets the same subtle lift the rest of this
     template's interactive elements already had -- table wrapper/form
     cards read as calm surfaces at rest and settle right back down, a
     dashboard tile/chart reads as a real target worth pointing at.
     `--hover-lift-px`/`--motion-*` are the same tokens `.btn`/`.nav-item`
     already use, so `motion: none`/a reduced theme scales this down for
     free, no separate opt-out needed. */
  .card:hover { box-shadow: var(--md-elevation-1); border-color: var(--md-outline); transform: translateY(calc(-1 * var(--hover-lift-px))); }
  .field {
    display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--density-gap);
  }
  .field label { font-size: 12px; color: var(--md-on-surface-variant); font-weight: 500; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field select {
    font-family: var(--font-sans); font-size: var(--density-font-size); height: var(--density-control-height);
    padding: 0 14px; border-radius: var(--radius-control);
    border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface);
    transition: border-color var(--motion-interaction-ms) var(--motion-easing),
                box-shadow var(--motion-interaction-ms) var(--motion-easing);
  }
  /* A numeric value reads as data, not prose -- `IBM Plex Mono`'s fixed
     digit widths make a column of amounts/quantities actually line up,
     the same reasoning a spreadsheet or a terminal already applies. */
  .field input[type=number] { font-family: var(--font-mono); }
  .field input:hover, .field select:hover { border-color: var(--md-on-surface-variant); }
  .field input:focus-visible, .field select:focus-visible {
    outline: 2px solid var(--brand-accent); outline-offset: -1px; border-color: var(--brand-accent);
  }
  .field input:disabled, .field select:disabled { opacity: .5; pointer-events: none; }
  .field.checkbox { flex-direction: row; align-items: center; gap: 8px; }
  .field .readonly { font-size: 13px; color: var(--md-on-surface-variant); font-style: italic; }
  fieldset.field { padding-top: 20px; margin: 0 0 16px; }
  fieldset.field legend { padding: 0 6px; font-size: 12px; color: var(--md-on-surface-variant); font-weight: 500; }
  fieldset.field .field:last-child { margin-bottom: 0; }
  .btn {
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 0 24px;
    height: var(--density-control-height); border-radius: var(--md-radius-lg); border: none; cursor: pointer;
    transition: background-color var(--motion-interaction-ms) var(--motion-easing),
                color var(--motion-interaction-ms) var(--motion-easing),
                box-shadow var(--motion-interaction-ms) var(--motion-easing),
                transform var(--motion-interaction-ms) var(--motion-easing),
                opacity var(--motion-interaction-ms) var(--motion-easing);
  }
  .btn:hover:not(:disabled) { transform: translateY(calc(-1 * var(--hover-lift-px))) scale(var(--hover-scale)); box-shadow: var(--md-elevation-1); }
  .btn:active:not(:disabled) { transform: scale(var(--press-scale)); }
  .btn:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
  .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
  .btn-filled:disabled { opacity: .38; }
  .btn-outlined { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); }
  .btn-outlined:hover:not(:disabled) { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
  .btn-text { background: transparent; color: var(--md-primary); }
  .btn-text:hover:not(:disabled) { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
  .btn-danger { background: var(--md-error); color: var(--md-on-error); }
  /* Wraps every generated table -- a table wider than `main`'s own
     max-width scrolls inside this box instead of overflowing the page. */
  .table-scroll { overflow-x: auto; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--md-on-surface-variant); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--md-outline);
       white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--md-surface-variant); white-space: nowrap; }
  /* 2026-08-27, default-style pass: a data row reads as clickable the
     way `.nav-item`/`.btn` already do -- `tbody` scoped so this never
     touches the header (`thead tr`) or a filter row, and `background`
     alone (no transform) since a shifting row is disorienting mid-scan
     the way a shifting button/card isn't. */
  tbody tr { transition: background-color var(--motion-interaction-ms) var(--motion-easing); }
  tbody tr:hover { background: color-mix(in srgb, var(--md-primary) 5%, transparent); }
  .pager { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--md-on-surface-variant); }
  .search-box {
    font-family: var(--font-sans); font-size: 14px; padding: 10px 14px; border-radius: var(--radius-control);
    border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface);
    width: 100%; max-width: 320px; margin-bottom: 12px; display: block;
    transition: border-color var(--motion-interaction-ms) var(--motion-easing);
  }
  .search-box:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: -1px; border-color: var(--brand-accent); }
  .col-filter {
    font-family: inherit; font-size: 12px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--md-outline);
    transition: border-color var(--motion-interaction-ms) var(--motion-easing);
  }
  .col-filter:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: -1px; }
  /* `layout.app_shell`/`layout.content_width` -- CSS-only variants on the
     one fixed shell (`html`'s static class list, computed once at
     `emit-ui`/`serve` generation time from `Theme.layout`, LANGUAGE.md
     SS11a). "auto"/absent (no class at all) keeps today's shell
     byte-for-byte -- every `.nir` app that predates this field is
     completely unaffected. */
  html.shell-topbar .layout { flex-direction: column; }
  html.shell-topbar .nav-rail {
    width: 100%; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center;
    border-right: none; border-bottom: 1px solid var(--md-surface-variant); padding: 8px 16px;
  }
  html.shell-topbar .nav-item { width: auto; margin-bottom: 0; }
  html.shell-topbar .nav-item-secondary { padding-left: 16px; }
  html.shell-minimal .nav-rail { display: none; }
  html.shell-minimal main { flex: none; width: 100%; max-width: 420px; margin: 40px auto; padding: 24px; }
  html.content-boxed main { margin: 0 auto; }
  html.content-fluid main { max-width: none; }
  .nav-item-secondary { padding-left: 32px; font-size: 13px; }
  .date-lock { margin-left: 6px; cursor: help; font-size: 12px; opacity: .7; }
  .empty-state { color: var(--md-on-surface-variant); font-size: 14px; padding: 32px; text-align: center; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 8px;
    background: var(--md-surface-variant); color: var(--md-on-surface-variant); margin-left: 6px;
  }
  .gate-note { font-size: 12px; color: var(--md-error); margin-top: 4px; }
  .row-actions { display: flex; gap: 6px; }
  .stub-note {
    font-size: 12px; color: var(--md-on-surface-variant); background: var(--md-surface-variant);
    padding: 8px 12px; border-radius: var(--md-radius-sm); margin-bottom: 16px;
  }
  .snackbar {
    position: fixed; left: 24px; bottom: 24px; background: #2f3033; color: #f1f0f4;
    padding: 14px 20px; border-radius: var(--md-radius-sm); box-shadow: var(--md-elevation-2);
    font-size: 14px; max-width: 400px; z-index: 100;
  }
  .snackbar.error { background: var(--md-error-container); color: var(--md-on-error); }

<body>
<div class="app-bar">
  <img class="app-bar-mark" src="__NIRDOSHA_LOGO__" alt="" width="32" height="32">
  <h1 id="app-title">Nirdosha App</h1>
  <div id="identity-slot"></div>
</div>
<div class="layout">
  <nav class="nav-rail" id="nav"></nav>
  <main id="content"></main>
</div>
<div class="snackbar" id="snackbar" hidden></div>

<script>
"use strict";
const MANIFEST = __NIRDOSHA_MANIFEST__;
const STATS = __NIRDOSHA_STATS__;
const CHARTS = __NIRDOSHA_CHARTS__;
// One entry per declared `workflow` (`WORKFLOW.md`'s "state ownership +
// a generated queue UI" section) -- `{name, snake, title, pendingFn,
// pendingRequiresLogin, advanceFn, dataFields}`. Unlike `MANIFEST`'s
// screens, there's no static per-row action set here: which buttons a
// row gets is decided per-row, at fetch time, by `pendingFn`'s own
// response -- see `renderWorkflowQueue`.
const WORKFLOWS = __NIRDOSHA_WORKFLOWS__;
const API_BASE = window.NIRDOSHA_API_BASE || "/api";
const IDENTITY_BASE = __NIRDOSHA_IDENTITY_BASE__;
const IDENTITY_KEY = "nirdosha_identity";
// Whether `nirdosha serve --db <path>` exposes the generic
// `/_nirdosha/table/<snake>` pagination/sort/filter/search route
// (`serve.rs`). `false` (the default, and always the case for `nirdosha
// emit-ui`'s static-file mode) means every table renders exactly as it
// always has -- one unpaginated fetch, no pagination/sort/search UI at
// all -- see `ui_gen.rs::generate`'s own doc comment for why this is a
// deliberate degradation, not a missing feature.
const SERVER_TABLE_API = __NIRDOSHA_SERVER_TABLE_API__;

// ---- identity ----
// With no IDENTITY_BASE (the default), this is a pure client-side STUB:
// login just stores {subject, roles, claims} in localStorage, no token
// involved, and nothing is ever sent to the server to prove it -- fine
// for previewing a generated UI, but a `requires(role: ...)`-gated
// action will never actually pass `serve.rs`'s server-side check this
// way, since there's no token to send.
//
// With IDENTITY_BASE set (`nirdosha serve --identity-base <url>`), login
// instead POSTs to a *real* identity app's `/api/login` and stores the
// real signed token it gets back; `callFn` then attaches it as
// `Authorization: Bearer <token>` on every call, which is what lets a
// `requires`-gated action actually succeed. `roles`/`claims` are then
// read back out of the token's own payload (base64url-decoded client
// side, not re-verified here -- the server verifies it independently on
// every call; this decode is display/gating-hint only).
function getIdentity() {
  try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || "null"); }
  catch (e) { return null; }
}
function setIdentity(id) { localStorage.setItem(IDENTITY_KEY, JSON.stringify(id)); }
function clearIdentity() { localStorage.removeItem(IDENTITY_KEY); }

function decodeJwtPayload(token) {
  try {
    const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(atob(b64));
  } catch (e) { return {}; }
}

function canRun(action) {
  if (!action.requiresLogin) return true;
  const id = getIdentity();
  if (!id) return false;
  if (action.requiredRole && !(id.roles || []).includes(action.requiredRole)) return false;
  if (action.requiredClaim) {
    const [key, val] = action.requiredClaim;
    if ((id.claims || {})[key] !== val) return false;
  }
  return true;
}

// `screen <Struct> { field <name> { view: role(...)/claim(...) } }` --
// any-of role match (a field can name more than one role, unlike
// `canRun`'s single `requiredRole`), or the one claim pair. Cosmetic
// only, same disclosed nature as every other client-side gate here --
// `serve.rs` independently redacts the same field server-side (to
// `null`) regardless of what this function decides, so a tampered
// client can hide/show this box however it likes without exposing
// anything this check didn't already let through.
function canViewField(f) {
  const roles = f.requiredViewRoles || [];
  if (!roles.length && !f.requiredViewClaim) return true;
  const id = getIdentity();
  if (!id) return false;
  if (roles.some((r) => (id.roles || []).includes(r))) return true;
  if (f.requiredViewClaim) {
    const [key, val] = f.requiredViewClaim;
    if ((id.claims || {})[key] === val) return true;
  }
  return false;
}

// Same shape as `canViewField`, for `{ edit: ... }` -- whether the
// current identity may change this field's value, not whether it's
// shown at all. `serve.rs` independently rejects an unauthorized change
// to this field on submit regardless of whether the input was actually
// left enabled here.
function canEditField(f) {
  const roles = f.requiredEditRoles || [];
  if (!roles.length && !f.requiredEditClaim) return true;
  const id = getIdentity();
  if (!id) return false;
  if (roles.some((r) => (id.roles || []).includes(r))) return true;
  if (f.requiredEditClaim) {
    const [key, val] = f.requiredEditClaim;
    if ((id.claims || {})[key] === val) return true;
  }
  return false;
}

// ---- snackbar ----
let snackbarTimer = null;
function showSnackbar(msg, isError) {
  const el = document.getElementById("snackbar");
  el.textContent = msg;
  el.className = "snackbar" + (isError ? " error" : "");
  el.hidden = false;
  clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

// ---- API call, Result(T,E)-shaped: {ok: ...} | {err: ...} ----
async function callFn(fnName, params) {
  try {
    const headers = { "Content-Type": "application/json" };
    const id = getIdentity();
    if (id && id.token) headers["Authorization"] = `Bearer ${id.token}`;
    const res = await fetch(`${API_BASE}/${fnName}`, {
      method: "POST",
      headers,
      body: JSON.stringify(params || {}),
    });
    const body = await res.json();
    if (body && Object.prototype.hasOwnProperty.call(body, "err")) {
      showSnackbar(String(body.err), true);
      return null;
    }
    return body && Object.prototype.hasOwnProperty.call(body, "ok") ? body.ok : body;
  } catch (e) {
    showSnackbar(`${fnName}: ${e.message}`, true);
    return null;
  }
}

// ---- generic table-query fetch, only used when SERVER_TABLE_API ----
// Hits `/_nirdosha/table/<table>` (`serve.rs`'s `dispatch_table_query`)
// directly -- a different response shape than `callFn`'s Result(T,E)
// convention (`{rows, total, page, page_size}` or `{err}`), so it's its
// own small fetch wrapper rather than a `callFn` variant.
async function fetchTablePage(table, body) {
  try {
    const headers = { "Content-Type": "application/json" };
    const id = getIdentity();
    if (id && id.token) headers["Authorization"] = `Bearer ${id.token}`;
    const res = await fetch(`/_nirdosha/table/${table}`, { method: "POST", headers, body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (data && data.err) { showSnackbar(String(data.err), true); return null; }
    return data;
  } catch (e) {
    showSnackbar(`${table}: ${e.message}`, true);
    return null;
  }
}

function debounce(fn, ms) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// ---- generic element builder (no innerHTML -- avoids reflecting any
// program-derived string back as markup) ----
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children || []) if (c) n.appendChild(c);
  return n;
}

// A field's display name -- `screen <Struct> { field <name> { label:
// "..." } }`'s override when declared, the raw field name otherwise.
// Never used for API payload keys (those always stay `f.name`).
function fieldLabel(f) {
  return f.displayLabel || f.name;
}

// ---- generic field -> control, recursive (one level of struct nesting
// per build_field's own depth cap on the Rust side) ----
// `isEdit` (true only for an *update* form, never create) hides a field
// literally named `id` from rendering -- a primary key is never
// meaningfully user-editable -- while still carrying its value through
// to `getValue()`'s output, read directly out of the row `value` object
// rather than any input's DOM value (a genuinely `disabled` input would
// be silently excluded from what `getValue` could otherwise read here,
// so this is not a cosmetic choice). A `view`-gated field the current
// identity can't see gets the exact same "hidden but passed through
// unchanged" treatment -- `serve.rs` independently substitutes the
// stored value server-side for one of these if it's omitted/`null`
// (`dispatch`'s own view-gated pass-through-on-omit step), so `value`
// here (already redacted to `null` by the server on the way in, for
// anyone unauthorized) round-trips correctly either way; this is purely
// about not rendering an input box for a value this viewer never saw.
function buildFieldControl(f, value, isEdit, topLevel) {
  // `edit`-gated: never blocks a *create* (only an update form passes
  // `isEdit === true`) -- see `serve.rs::check_edit_gates`'s own doc
  // comment for why. Disables the input rather than hiding it (the
  // field is still visible, just not changeable by this identity) --
  // `serve.rs` independently rejects a changed value on submit
  // regardless of whether this was left enabled.
  const editLocked = isEdit && !canEditField(f);
  if (f.control === "struct") {
    const passthrough = f.nested.filter((nf) => (isEdit && nf.name === "id") || !canViewField(nf));
    const visible = f.nested.filter((nf) => !passthrough.includes(nf));
    const children = visible.map((nf) => buildFieldControl(nf, value ? value[nf.name] : undefined, isEdit, false));
    // `topLevel`: this struct *is* the create/update action's own single
    // param (`buildForm`'s direct call, e.g. `create_vendor(v: Vendor)`)
    // -- not a field genuinely nested inside another struct. Wrapping
    // that case in a bordered fieldset+legend just exposes the
    // parameter's own terse name ("v *") for no reason, since the form
    // itself is already that container; a real nested struct (one level
    // deep, recursing into this same branch with `topLevel: false`)
    // still gets the bordered/labeled treatment so it reads as a group.
    const wrap = topLevel
      ? el("div", { class: "field" }, children.map((c) => c.el))
      : el("fieldset", { class: "field", style: "border:1px solid var(--md-outline);border-radius:var(--md-radius-sm);padding:12px;" },
          [el("legend", { text: fieldLabel(f) + (f.required ? " *" : "") }), ...children.map((c) => c.el)]);
    return { el: wrap, getValue: () => {
      const out = Object.fromEntries(visible.map((nf, i) => [nf.name, children[i].getValue()]));
      for (const pf of passthrough) out[pf.name] = value ? value[pf.name] : undefined;
      return out;
    }};
  }
  if (f.control === "readonly") {
    const shown = value !== undefined && value !== null ? (typeof value === "object" ? JSON.stringify(value) : String(value)) : `(${f.label}, not editable here)`;
    const wrap = el("div", { class: "field" }, [el("label", { text: fieldLabel(f) }), el("div", { class: "readonly", text: shown })]);
    return { el: wrap, getValue: () => value };
  }
  if (f.control === "checkbox") {
    const input = el("input", { type: "checkbox" });
    input.checked = !!value;
    if (editLocked) input.setAttribute("disabled", "");
    const wrap = el("div", { class: "field checkbox" }, [input, el("label", { text: fieldLabel(f) })]);
    return { el: wrap, getValue: () => input.checked };
  }
  if (f.control === "select") {
    // A categorical/ordinal field (a zero-payload-only enum,
    // `ui_gen.rs::build_field`'s doc comment) -- `f.options` is every
    // variant name in declaration order. A native `<input list=...>` +
    // `<datalist>` pair is a real, searchable dropdown with zero JS
    // dependency, matching this template's no-build-step ethos.
    const listId = `dl-${f.name}-${Math.random().toString(36).slice(2, 8)}`;
    const input = el("input", { type: "text", list: listId, value: value !== undefined && value !== null ? value : "" });
    if (f.required) input.setAttribute("required", "");
    if (editLocked) input.setAttribute("disabled", "");
    const datalist = el("datalist", { id: listId }, f.options.map((o) => el("option", { value: o })));
    const wrap = el("div", { class: "field" }, [el("label", { text: fieldLabel(f) + (f.required ? " *" : "") }), input, datalist]);
    return { el: wrap, getValue: () => input.value };
  }
  if (f.control === "date") {
    // A `date`/`time`-named str field (a naming-convention heuristic,
    // not a new language type -- `ui_gen.rs::is_date_like_field_name`'s
    // doc comment). The lock is decorative only: "human-supplied, not an
    // automatic clock-stamp" -- Nirdosha has no wall-clock builtin at
    // all (LANGUAGE.md SS9), by deliberate design; the field stays a
    // plain, fully editable string underneath.
    const input = el("input", { type: "date", value: value !== undefined && value !== null ? value : "" });
    if (f.required) input.setAttribute("required", "");
    if (editLocked) input.setAttribute("disabled", "");
    const labelRow = el("div", { style: "display:flex;align-items:center;" }, [
      el("label", { text: fieldLabel(f) + (f.required ? " *" : "") }),
      el("span", { class: "date-lock", title: "Human-supplied date -- not an automatic clock-stamp.", text: "\u{1F512}" }),
    ]);
    const wrap = el("div", { class: "field" }, [labelRow, input]);
    return { el: wrap, getValue: () => input.value };
  }
  const input = el("input", { type: f.control, value: value !== undefined && value !== null ? value : "" });
  if (f.required) input.setAttribute("required", "");
  if (editLocked) input.setAttribute("disabled", "");
  // `screen <Struct> { field <name> { pattern/min/max: ... } }` —
  // native HTML5 constraint validation, so a bad value never even
  // reaches submit. Cosmetic only, same split as `canEditField`
  // above: `serve.rs::check_field_validations` is the real boundary,
  // enforcing the identical constraint server-side regardless of
  // whether a client bypasses this (a raw `curl` to `/api/<fn>`, a
  // browser with JS disabled, or a tampered DOM).
  if (f.pattern) {
    input.setAttribute("pattern", f.pattern);
    input.setAttribute("title", `Must match pattern: ${f.pattern}`);
  }
  if (f.min !== undefined && f.min !== null) input.setAttribute("min", f.min);
  if (f.max !== undefined && f.max !== null) input.setAttribute("max", f.max);
  const wrap = el("div", { class: "field" }, [el("label", { text: fieldLabel(f) + (f.required ? " *" : "") }), input]);
  // `label === "Text"` marks the enum-favoring-`str`-ban free-text carrier
  // (`struct Text { value: str }`, `ui_gen.rs::build_field`'s doc comment)
  // -- it renders as this same flat text box, but `serve.rs::decode_value`
  // still decodes it via the generic one-field-struct rule, which expects
  // a JSON object (`{"value": "..."}"`), not a bare string. Wrap on submit
  // to match; the display side needs no corresponding unwrap since a
  // `Text` field's value comes back from SQL storage as a plain string
  // already (the struct is a single flat TEXT column, never JSON there).
  return { el: wrap, getValue: () => {
    if (f.control === "number") return Number(input.value);
    if (f.control === "text" && f.label === "Text") return { value: input.value };
    return input.value;
  }};
}

// ---- generic field-list -> form ----
// `isEdit` (see `buildFieldControl` above): a top-level field literally
// named `id` (a `delete_<S>(id: i64)`-shaped param, rather than the more
// common whole-struct `update_<S>(s: S)` shape `buildFieldControl`'s own
// "struct" branch already handles) gets the same treatment here, for
// symmetry -- hidden from the rendered form, its value still read
// directly from `values` (never a DOM input) into the submitted payload.
// A top-level `view`-gated field the identity can't see gets the same
// pass-through treatment (see `buildFieldControl`'s own doc comment for
// why this has to be a pass-through, not a plain omission).
function buildForm(fields, values, onSubmit, submitLabel, disabled, disabledReason, isEdit) {
  const passthrough = fields.filter((f) => (isEdit && f.name === "id") || !canViewField(f));
  const visible = fields.filter((f) => !passthrough.includes(f));
  const controls = visible.map((f) => ({ f, c: buildFieldControl(f, values ? values[f.name] : undefined, isEdit, true) }));
  const submitBtn = el("button", { type: "submit", class: "btn btn-filled", text: submitLabel }, []);
  if (disabled) submitBtn.setAttribute("disabled", "");
  const form = el("form", { class: "card", onsubmit: (e) => {
    e.preventDefault();
    const out = {};
    for (const { f, c } of controls) out[f.name] = c.getValue();
    for (const pf of passthrough) out[pf.name] = values ? values[pf.name] : undefined;
    onSubmit(out);
  }}, controls.map(({ c }) => c.el));
  form.appendChild(submitBtn);
  if (disabled && disabledReason) form.appendChild(el("div", { class: "gate-note", text: disabledReason }));
  return form;
}

function gateReason(action) {
  if (!action.requiresLogin) return null;
  if (!getIdentity()) return "Sign in to use this.";
  if (action.requiredRole) return `Requires role "${action.requiredRole}".`;
  if (action.requiredClaim) return `Requires claim ${action.requiredClaim[0]} = "${action.requiredClaim[1]}".`;
  return "Sign in to use this.";
}

// ---- screen renderers ----
// The row's own plain values, reshaped into `updateAction`'s own param
// list -- a struct-typed param (the common `update_<S>(x: S)`
// convention) gets the whole row as its value (`buildFieldControl`'s
// "struct" branch then reads each nested field off it); anything else
// is looked up by that param's own name directly off the row.
function updateValuesFromRow(updateAction, row) {
  const values = {};
  for (const p of updateAction.params) values[p.name] = p.control === "struct" ? row : row[p.name];
  return values;
}

// A `checkbox`-controlled (i.e. `bool`-typed) cell reads "True"/"False"
// instead of the raw stored value (`true`/`false`, or `1`/`0` coming
// back through the generic table-query route, which encodes SQLite's
// own boolean-as-integer storage) -- deterministic, no per-field-name
// guessing ("Active"/"Inactive" and the like).
function cellText(f, row) {
  const v = row && row[f.name] !== undefined ? row[f.name] : "";
  if (f.control === "checkbox") return v === true || v === 1 || v === "1" || v === "true" ? "True" : "False";
  return v !== null && v !== undefined ? String(v) : "";
}

async function renderListScreen(screen, root) {
  const listAction = screen.actions.find((a) => a.kind === "list");
  const createAction = screen.actions.find((a) => a.kind === "create");
  const updateAction = screen.actions.find((a) => a.kind === "update");
  const deleteAction = screen.actions.find((a) => a.kind === "delete");
  // `screen <Struct> { action "<label>" -> <fn> { ... } }` -- zero or
  // more custom per-row actions beyond the inferred CRUD set, each its
  // own toolbar column, same gating/disabled-reason machinery as
  // update/delete.
  const customActions = screen.actions.filter((a) => a.kind === "custom");

  if (createAction) {
    root.appendChild(el("h2", { text: "New " + screen.title, style: "font-size:16px;font-weight:500;" }));
    root.appendChild(buildForm(
      createAction.params, null,
      async (values) => { const r = await callFn(createAction.fn, values); if (r !== null) { showSnackbar(`${screen.title} created.`); load(); } },
      "Create", !canRun(createAction), gateReason(createAction),
    ));
  }

  // Pagination/sort/search/filter state -- only ever exercised when
  // `SERVER_TABLE_API` is true (`nirdosha serve --db <path>`); with it
  // false (the default), `load()` below takes the exact same
  // `callFn(listAction.fn, {})` path this screen always has, and none of
  // this state is ever read. See `serve.rs::dispatch_table_query`'s doc
  // comment for the real limitation this implies (a hand-written
  // `list_<struct>` doing a join or computed column is invisible to the
  // generic route -- this is a deliberate, disclosed degradation, not a
  // missing feature).
  const usePagination = SERVER_TABLE_API && !!listAction;
  let page = 1;
  const pageSize = 25;
  let sortField = screen.fields.length ? screen.fields[0].name : null;
  let sortDir = "asc";
  let searchQuery = "";
  const filters = {};

  let searchBox = null;
  if (usePagination) {
    searchBox = el("input", { type: "text", class: "search-box", placeholder: "Search…" });
    searchBox.addEventListener("input", debounce(() => { searchQuery = searchBox.value; page = 1; load(); }, 300));
    root.appendChild(searchBox);
  }

  // Paired with the create form's "New <Title>" heading above (when one
  // exists) so a page with both a form and a table has an unambiguous
  // boundary between "adding a record" and "the records that already
  // exist" -- previously the table had no heading of its own at all,
  // distinguishable from the create form only by page position.
  root.appendChild(el("h2", { text: "Existing " + screen.title, style: "font-size:16px;font-weight:500;" }));
  const tableWrap = el("div", { class: "card" }, []);
  root.appendChild(tableWrap);

  async function load() {
    tableWrap.textContent = "";
    if (!listAction) { tableWrap.appendChild(el("div", { class: "empty-state", text: "No list action defined for " + screen.title + "." })); return; }
    if (!canRun(listAction)) { tableWrap.appendChild(el("div", { class: "empty-state", text: gateReason(listAction) })); return; }
    tableWrap.appendChild(el("div", { class: "empty-state", text: "Loading…" }));

    let list, total = null;
    if (usePagination) {
      const body = { page, page_size: pageSize, sort_field: sortField, sort_dir: sortDir };
      if (searchQuery) body.search = searchQuery;
      if (Object.keys(filters).length) body.filters = filters;
      const data = await fetchTablePage(screen.table, body);
      if (data === null) { tableWrap.textContent = ""; tableWrap.appendChild(el("div", { class: "empty-state", text: "Could not load records." })); return; }
      list = Array.isArray(data.rows) ? data.rows : [];
      total = typeof data.total === "number" ? data.total : list.length;
    } else {
      const rows = await callFn(listAction.fn, {});
      list = Array.isArray(rows) ? rows : [];
    }

    tableWrap.textContent = "";
    if (list.length === 0) { tableWrap.appendChild(el("div", { class: "empty-state", text: "No records yet." })); return; }

    // `view`-gated columns the current identity can't see are omitted
    // from the table entirely (cosmetic -- `serve.rs` already redacted
    // their values to `null` server-side regardless of this), recomputed
    // every `load()` so a re-login mid-session is reflected immediately.
    const visibleFields = screen.fields.filter(canViewField);

    const table = el("table", {}, []);
    const thead = el("tr", {}, visibleFields.map((f) => {
      let text = fieldLabel(f);
      if (usePagination && sortField === f.name) text += sortDir === "asc" ? " ▲" : " ▼";
      const th = el("th", { text });
      if (usePagination) {
        th.style.cursor = "pointer";
        th.addEventListener("click", () => {
          if (sortField === f.name) sortDir = sortDir === "asc" ? "desc" : "asc";
          else { sortField = f.name; sortDir = "asc"; }
          load();
        });
      }
      return th;
    }));
    if (updateAction) thead.appendChild(el("th", { text: "" }));
    if (deleteAction) thead.appendChild(el("th", { text: "" }));
    for (const _ of customActions) thead.appendChild(el("th", { text: "" }));
    const theadRows = [thead];

    // A filter row under the header, one `<select>` per enum-backed
    // ("select" control) column, populated from that field's own known
    // `options` -- no separate "distinct values" query needed, since the
    // full option set is already static per the enum's declaration.
    // Every other column type has no per-column filter control here
    // (the free-text search box above already covers them).
    if (usePagination && visibleFields.some((f) => f.control === "select")) {
      const filterCells = visibleFields.map((f) => {
        if (f.control !== "select") return el("th", { text: "" });
        const sel = el("select", { class: "col-filter" }, [
          el("option", { value: "", text: "(any)" }),
          ...f.options.map((o) => el("option", { value: o, text: o })),
        ]);
        sel.value = filters[f.name] || "";
        sel.addEventListener("change", () => {
          if (sel.value) filters[f.name] = sel.value; else delete filters[f.name];
          page = 1; load();
        });
        return el("th", {}, [sel]);
      });
      const filterRow = el("tr", {}, filterCells);
      if (updateAction) filterRow.appendChild(el("th", { text: "" }));
      if (deleteAction) filterRow.appendChild(el("th", { text: "" }));
      for (const _ of customActions) filterRow.appendChild(el("th", { text: "" }));
      theadRows.push(filterRow);
    }
    table.appendChild(el("thead", {}, theadRows));

    const tbody = el("tbody", {}, []);
    // Staggered entrance (`--stagger-ms` -- `DesignSpec.motion`'s own
    // per-item list delay, protobox's own React convention for the same
    // thing: `animationDelay: index * stagger_ms`, ported here as an
    // inline style on each `<tr>`). `--stagger-ms` has no unit (it's a
    // bare number, `theme_override_css`'s own choice) since it's only
    // ever multiplied here, not used as a CSS length directly.
    let rowIndex = 0;
    for (const row of list) {
      const tds = visibleFields.map((f) => el("td", { text: cellText(f, row) }));
      const colspan = visibleFields.length + (updateAction ? 1 : 0) + (deleteAction ? 1 : 0) + customActions.length;
      let tr, editRow = null;
      if (updateAction) {
        const btn = el("button", { class: "btn btn-outlined", text: "Edit" }, []);
        if (!canRun(updateAction)) btn.setAttribute("disabled", "");
        btn.addEventListener("click", () => {
          if (editRow) { editRow.remove(); editRow = null; return; }
          const form = buildForm(
            updateAction.params, updateValuesFromRow(updateAction, row),
            async (values) => { const r = await callFn(updateAction.fn, values); if (r !== null) { showSnackbar(`${screen.title} updated.`); load(); } },
            "Save", !canRun(updateAction), gateReason(updateAction), true,
          );
          editRow = el("tr", {}, [el("td", { colspan: String(colspan) }, [form])]);
          tr.after(editRow);
        });
        tds.push(el("td", {}, [btn]));
      }
      if (deleteAction) {
        const idParam = deleteAction.params[0];
        const btn = el("button", { class: "btn btn-danger", text: "Delete" }, []);
        if (!canRun(deleteAction)) btn.setAttribute("disabled", "");
        btn.addEventListener("click", async () => {
          const payload = idParam ? { [idParam.name]: row[idParam.name] } : row;
          const r = await callFn(deleteAction.fn, payload);
          if (r !== null) { showSnackbar(`${screen.title} deleted.`); load(); }
        });
        tds.push(el("td", {}, [btn]));
      }
      for (const action of customActions) {
        const btn = el("button", { class: action.style === "filled" ? "btn btn-filled" : "btn btn-outlined", text: action.label || action.fn }, []);
        if (!canRun(action)) btn.setAttribute("disabled", "");
        btn.addEventListener("click", async () => {
          if (action.confirm && !window.confirm(action.confirm)) return;
          const idParam = action.params[0];
          const payload = idParam ? { [idParam.name]: row[idParam.name] } : row;
          const r = await callFn(action.fn, payload);
          if (r !== null) { showSnackbar(`${action.label || action.fn} done.`); load(); }
        });
        tds.push(el("td", {}, [btn]));
      }
      tr = el("tr", { class: "row-enter", style: `animation-delay: calc(var(--stagger-ms) * ${rowIndex} * 1ms)` }, tds);
      rowIndex++;
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(el("div", { class: "table-scroll" }, [table]));

    if (usePagination && total !== null) {
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const prev = el("button", { class: "btn btn-outlined", text: "Prev", onclick: () => { if (page > 1) { page--; load(); } } });
      const next = el("button", { class: "btn btn-outlined", text: "Next", onclick: () => { if (page < totalPages) { page++; load(); } } });
      if (page <= 1) prev.setAttribute("disabled", "");
      if (page >= totalPages) next.setAttribute("disabled", "");
      tableWrap.appendChild(el("div", { class: "pager" }, [prev, el("span", { text: `Page ${page} of ${totalPages} (${total} total)` }), next]));
    }
  }
  load();
}

// `WORKFLOW.md`'s "state ownership + a generated queue UI" section --
// unlike `renderListScreen`, there's no fixed action set for the whole
// table: each row's own button set is that row's own current state's own
// outgoing `events`, straight from `pendingFn`'s response
// (`interpreter.rs::workflow_pending_for_me`) -- a different row can be
// in a different state with entirely different buttons. Clicking one
// calls `advanceFn(instance_id, event, payload)` -- `payload` carries an
// optional `{comment}` the caller was prompted for (`WORKFLOW.md`'s
// "audit trail" section: still not threaded into `on_entry`/`on_exit`
// bindings, that gap's own disclosed scope, just logged to the history
// row now). Two tabs share this same render: "Waiting on me"
// (`pendingFn`, action buttons rendered) and "My requests"
// (`submittedByMeFn`, `WORKFLOW.md`'s "who submitted this" section --
// the requester's own view, read-only, no buttons since they're not the
// decider). Every row in either tab gets a "History" button
// (`WORKFLOW.md`'s "audit trail" section, `historyFn`) that expands an
// inline transition log below the row, the same toggle-a-row-below-it
// shape `renderListScreen`'s own inline edit form already uses.
async function renderWorkflowQueue(wf, root) {
  root.appendChild(el("h2", { text: wf.title, style: "font-size:16px;font-weight:500;" }));

  const tabBar = el("div", { class: "row-actions", style: "margin-bottom:12px;" }, []);
  const pendingTab = el("button", { class: "btn btn-filled", text: "Waiting on me" });
  const mineTab = el("button", { class: "btn btn-outlined", text: "My requests" });
  tabBar.appendChild(pendingTab);
  tabBar.appendChild(mineTab);
  root.appendChild(tabBar);

  const tableWrap = el("div", { class: "card" }, []);
  root.appendChild(tableWrap);

  let mode = "pending"; // "pending" | "mine"
  function setMode(next) {
    if (mode === next) return;
    mode = next;
    pendingTab.className = mode === "pending" ? "btn btn-filled" : "btn btn-outlined";
    mineTab.className = mode === "mine" ? "btn btn-filled" : "btn btn-outlined";
    load();
  }
  pendingTab.addEventListener("click", () => setMode("pending"));
  mineTab.addEventListener("click", () => setMode("mine"));

  function historyTable(rows) {
    if (!Array.isArray(rows) || rows.length === 0) {
      return el("div", { class: "empty-state", text: "No history yet." });
    }
    const t = el("table", {}, []);
    t.appendChild(el("thead", {}, [
      el("tr", {}, ["From", "To", "Event", "By", "Via link", "Comment", "At"].map((h) => el("th", { text: h }))),
    ]));
    const tbody = el("tbody", {}, rows.map((h) => el("tr", {}, [
      el("td", { text: h.from_state }),
      el("td", { text: h.to_state }),
      el("td", { text: h.event }),
      el("td", { text: h.actor_subject || "(unauthenticated link)" }),
      el("td", { text: h.via_link ? "Yes" : "No" }),
      el("td", { text: h.comment || "" }),
      el("td", { text: new Date(h.at * 1000).toLocaleString() }),
    ])));
    t.appendChild(tbody);
    return el("div", { class: "table-scroll" }, [t]);
  }

  async function load() {
    tableWrap.textContent = "";
    tableWrap.appendChild(el("div", { class: "empty-state", text: "Loading…" }));
    const listFn = mode === "pending" ? wf.pendingFn : wf.submittedByMeFn;
    const rows = await callFn(listFn, {});
    tableWrap.textContent = "";
    if (!Array.isArray(rows) || rows.length === 0) {
      tableWrap.appendChild(el("div", { class: "empty-state",
        text: mode === "pending" ? "Nothing is waiting on you here." : "You haven't submitted anything here yet." }));
      return;
    }
    const table = el("table", {}, []);
    const thead = el("tr", {}, [
      ...wf.dataFields.map((f) => el("th", { text: fieldLabel(f) })),
      el("th", { text: "Status" }),
      el("th", { text: "" }),
    ]);
    table.appendChild(el("thead", {}, [thead]));
    const tbody = el("tbody", {}, []);
    let rowIndex = 0;
    for (const row of rows) {
      const tds = wf.dataFields.map((f) => el("td", { text: cellText(f, row.data) }));
      tds.push(el("td", {}, [el("span", { class: "badge", text: row.state_label || row.state, style: "margin-left:0;" })]));
      const btnCell = el("td", { class: "row-actions" }, []);
      let tr, historyRow = null;
      if (mode === "pending") {
        for (const eventName of row.events || []) {
          const btn = el("button", { class: "btn btn-filled", text: eventName });
          btn.addEventListener("click", async () => {
            const comment = window.prompt(`Add a comment for "${eventName}" (optional):`, "");
            if (comment === null) return; // cancelled, not an empty comment
            const payload = comment ? { comment } : null;
            const r = await callFn(wf.advanceFn, { instance_id: row.instance_id, event: eventName, payload });
            if (r !== null) { showSnackbar(`${eventName}: recorded.`); load(); }
          });
          btnCell.appendChild(btn);
        }
      }
      const historyBtn = el("button", { class: "btn btn-outlined", text: "History" });
      historyBtn.addEventListener("click", async () => {
        if (historyRow) { historyRow.remove(); historyRow = null; return; }
        const historyRows = await callFn(wf.historyFn, { instance_id: row.instance_id });
        const colspan = wf.dataFields.length + 2;
        historyRow = el("tr", {}, [el("td", { colspan: String(colspan) }, [historyTable(historyRows)])]);
        tr.after(historyRow);
      });
      btnCell.appendChild(historyBtn);
      tds.push(btnCell);
      tr = el("tr", { class: "row-enter", style: `animation-delay: calc(var(--stagger-ms) * ${rowIndex} * 1ms)` }, tds);
      rowIndex++;
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(el("div", { class: "table-scroll" }, [table]));
  }
  load();
}

async function renderSingularScreen(screen, root) {
  const getAction = screen.actions.find((a) => a.kind === "get");
  const updateAction = screen.actions.find((a) => a.kind === "update");
  const wrap = el("div", {}, []);
  root.appendChild(wrap);
  let current = null;
  if (getAction && canRun(getAction)) current = await callFn(getAction.fn, {});
  if (updateAction) {
    wrap.appendChild(buildForm(
      updateAction.params, current,
      async (values) => { const r = await callFn(updateAction.fn, values); if (r !== null) showSnackbar(`${screen.title} saved.`); },
      "Save", !canRun(updateAction), gateReason(updateAction), true,
    ));
  } else {
    wrap.appendChild(el("div", { class: "empty-state", text: "No update action defined for " + screen.title + "." }));
  }
}

// ---- dashboard: stat_ tiles + chart_ bar charts -------------------------

// A minimal inline-SVG horizontal bar chart -- `data` is whatever
// `chart_<name>()` resolved to: a `{label, value}[]` array by
// convention (`ui_gen.rs`'s `Metric` doc comment). No external charting
// library -- this file's own "self-contained, no external deps" stance.
function renderBarChart(data) {
  const rowH = 32, width = 480, labelW = 140, valueW = 60;
  const barMaxW = width - labelW - valueW;
  const maxVal = Math.max(1, ...data.map((d) => Math.abs(Number(d.value) || 0)));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${data.length * rowH + 8}`);
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", String(data.length * rowH + 8));
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "bar chart");
  data.forEach((d, i) => {
    const y = i * rowH + 4;
    const val = Number(d.value) || 0;
    const barW = Math.max(2, (Math.abs(val) / maxVal) * barMaxW);

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", String(labelW - 8));
    label.setAttribute("y", String(y + rowH / 2 + 4));
    label.setAttribute("text-anchor", "end");
    label.setAttribute("font-size", "12");
    label.style.fill = "var(--md-on-surface-variant)";
    label.textContent = String(d.label);
    svg.appendChild(label);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", String(labelW));
    rect.setAttribute("y", String(y + 4));
    rect.setAttribute("width", String(barW));
    rect.setAttribute("height", String(rowH - 12));
    rect.setAttribute("rx", "4");
    rect.style.fill = "var(--md-primary)";
    svg.appendChild(rect);

    const valText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    valText.setAttribute("x", String(labelW + barW + 8));
    valText.setAttribute("y", String(y + rowH / 2 + 4));
    valText.setAttribute("font-size", "12");
    valText.style.fill = "var(--md-on-surface)";
    valText.textContent = String(d.value);
    svg.appendChild(valText);
  });
  return svg;
}

async function renderDashboard() {
  const content = document.getElementById("content");
  content.textContent = "";
  content.appendChild(el("h1", { class: "screen-title", text: "Dashboard" }));

  if (STATS.length) {
    const grid = el("div", { style: "display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;" }, []);
    content.appendChild(grid);
    for (const stat of STATS) {
      const tile = el("div", { class: "card", style: "min-width:180px;flex:1;" }, [
        el("div", { class: "screen-sub", text: stat.label, style: "margin:0 0 8px;" }),
      ]);
      grid.appendChild(tile);
      if (!canRun(stat)) {
        tile.appendChild(el("div", { class: "gate-note", text: gateReason(stat) }));
        continue;
      }
      const valueEl = el("div", { text: "…", style: "font-size:32px;font-weight:500;" });
      tile.appendChild(valueEl);
      callFn(stat.fn, {}).then((v) => { valueEl.textContent = v === null ? "—" : String(v); });
    }
  }

  for (const chart of CHARTS) {
    const card = el("div", { class: "card" }, [el("div", { class: "screen-sub", text: chart.label, style: "margin:0 0 12px;" })]);
    content.appendChild(card);
    if (!canRun(chart)) {
      card.appendChild(el("div", { class: "gate-note", text: gateReason(chart) }));
      continue;
    }
    const holder = el("div", {}, [el("div", { class: "empty-state", text: "Loading…" })]);
    card.appendChild(holder);
    callFn(chart.fn, {}).then((data) => {
      holder.textContent = "";
      const rows = Array.isArray(data) ? data : [];
      if (rows.length === 0) { holder.appendChild(el("div", { class: "empty-state", text: "No data yet." })); return; }
      holder.appendChild(renderBarChart(rows));
    });
  }

  if (!STATS.length && !CHARTS.length) {
    content.appendChild(el("div", { class: "empty-state", text: "No stat_/chart_ functions defined." }));
  }
}

// Forces a CSS animation to replay from its start -- removing then
// re-adding a class doesn't restart the animation on its own (the
// browser doesn't see a class-list change as "new," since the class was
// never actually absent between two paints); reading `offsetWidth` in
// between forces a synchronous layout, which does.
function replayAnimation(node, cls) {
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

function renderScreen(screen) {
  const content = document.getElementById("content");
  content.textContent = "";
  replayAnimation(content, "screen-enter");
  content.appendChild(el("h1", { class: "screen-title", text: screen.title }));
  const sub = el("p", { class: "screen-sub", text: screen.singular ? "Single record" : "Records" }, []);
  const uniqueBadges = [...new Set(screen.actions.flatMap((a) => a.badges || []))];
  for (const b of uniqueBadges) sub.appendChild(el("span", { class: "badge", text: b }));
  content.appendChild(sub);
  if (!IDENTITY_BASE && screen.actions.some((a) => a.requiresLogin)) {
    content.appendChild(el("div", { class: "stub-note",
      text: "Sign-in on this page is a generated stub (localStorage identity), not real token verification -- wire it to your own auth once a backend exists." }));
  }
  if (screen.singular) renderSingularScreen(screen, content);
  else renderListScreen(screen, content);
}

// `WORKFLOW.md`'s "state ownership + a generated queue UI" section --
// `renderScreen`'s sibling for a `#/wf/<snake>` route instead of a
// `#/<screen>` one. No singular/list split (a workflow queue is always a
// table), no `requiresLogin` stub-note badge scan (every workflow fn
// takes `VerifiedIdentity`, unconditionally -- see `wf.pendingRequiresLogin`,
// always true).
function renderWorkflowScreen(wf) {
  const content = document.getElementById("content");
  content.textContent = "";
  replayAnimation(content, "screen-enter");
  content.appendChild(el("h1", { class: "screen-title", text: wf.title }));
  content.appendChild(el("p", { class: "screen-sub", text: "Workflow queue" }));
  if (!IDENTITY_BASE) {
    content.appendChild(el("div", { class: "stub-note",
      text: "Sign-in on this page is a generated stub (localStorage identity), not real token verification -- wire it to your own auth once a backend exists." }));
  }
  renderWorkflowQueue(wf, content);
}

// ---- login (stub) screen ----
// Called right after a successful sign-in. `route()` alone would just
// re-render the login screen again -- the hash is still `#/login` at
// that point, and `route()` reads the hash, not "did we just log in" --
// so a successful sign-in used to leave the user staring at the sign-in
// form a second time instead of landing in the app. Navigate to the
// dashboard (or the first screen the newly-signed-in identity can
// actually see, honoring the same role-based nav visibility `renderNav`
// itself applies) whenever sign-in happened *from* the login screen;
// leave the hash alone if sign-in happened via the nav-rail "Sign in"
// while already looking at a screen (rare, but don't yank them away).
function postLoginRedirect() {
  renderNav();
  const hash = (location.hash || "").replace(/^#\//, "");
  if (hash !== "login" && hash !== "") { route(); return; }
  if (HAS_DASHBOARD) {
    location.hash = "#/dashboard";
  } else {
    const first = MANIFEST.find((s) => { const gate = screenReadGate(s); return !gate || canRun(gate); });
    if (first) location.hash = "#/" + first.snake;
  }
  route();
}

function renderLogin() {
  const content = document.getElementById("content");
  content.textContent = "";
  content.appendChild(el("h1", { class: "screen-title", text: "Sign in" }));
  const subject = el("input", { type: "text", value: "" });
  const roles = el("input", { type: "text", value: "" });

  if (IDENTITY_BASE) {
    content.appendChild(el("div", { class: "stub-note",
      text: `Signs in against a mock identity server at ${IDENTITY_BASE} (examples/identity_mock.nir) -- a real signed token, verified independently by this app's own server on every call, but the identity server itself is a mock, not a real IdP.` }));
    const form = el("form", { class: "card", onsubmit: async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(`${IDENTITY_BASE}/api/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject: { value: subject.value || "user" }, role: roles.value }),
        });
        const body = await res.json();
        // `login`'s declared return is `Result(Text, Text)` (the str-ban's
        // wrapper struct), so a real `Err(Text)`/`Ok(Text)` payload is
        // `{value: "..."}`, not a bare string -- but a decode-level failure
        // (e.g. a malformed request body) is `serve.rs`'s own plain-string
        // `err`, not this fn's declared type. Unwrap `.value` when present,
        // fall back to the raw value otherwise, so both shapes render/work.
        const textValue = (x) => (x && typeof x === "object" && "value" in x) ? x.value : x;
        if (body && body.err) { showSnackbar(String(textValue(body.err)), true); return; }
        const token = textValue(body.ok);
        const claims = decodeJwtPayload(token);
        setIdentity({ subject: claims.sub || subject.value, roles: claims.roles || [], claims, token });
        showSnackbar("Signed in.");
        postLoginRedirect();
      } catch (err) { showSnackbar(`login: ${err.message}`, true); }
    }}, [
      el("div", { class: "field" }, [el("label", { text: "subject" }), subject]),
      el("div", { class: "field" }, [el("label", { text: "role (whatever your identity server recognizes)" }), roles]),
      el("button", { type: "submit", class: "btn btn-filled", text: "Sign in" }),
    ]);
    content.appendChild(form);
    return;
  }

  content.appendChild(el("div", { class: "stub-note",
    text: "Generated stub: stores a mock identity in this browser only, no token sent anywhere -- a requires(role: ...)-gated action cannot actually pass the server's check this way. Run with `nirdosha serve --identity-base <url>` for a real (mock) sign-in." }));
  const claims = el("input", { type: "text", value: "" });
  const form = el("form", { class: "card", onsubmit: (e) => {
    e.preventDefault();
    const claimPairs = {};
    for (const part of claims.value.split(",")) {
      const [k, v] = part.split("=").map((s) => (s || "").trim());
      if (k) claimPairs[k] = v || "";
    }
    setIdentity({ subject: subject.value || "user", roles: roles.value.split(",").map((s) => s.trim()).filter(Boolean), claims: claimPairs });
    showSnackbar("Signed in.");
    postLoginRedirect();
  }}, [
    el("div", { class: "field" }, [el("label", { text: "subject" }), subject]),
    el("div", { class: "field" }, [el("label", { text: "roles (comma-separated)" }), roles]),
    el("div", { class: "field" }, [el("label", { text: "claims (key=value, comma-separated)" }), claims]),
    el("button", { type: "submit", class: "btn btn-filled", text: "Sign in" }),
  ]);
  content.appendChild(form);
}

// ---- nav + routing ----
const HAS_DASHBOARD = STATS.length > 0 || CHARTS.length > 0;

function navButton(route, label, secondary) {
  return el("button", { class: secondary ? "nav-item nav-item-secondary" : "nav-item", text: label, "data-route": route, onclick: () => { location.hash = "#/" + route; } }, []);
}

// A screen's own read gate -- `list` for a table screen, else `get`,
// else `update` for a singular one (`is_singular`'s own definition:
// no `list`, but a `get` or `update` exists) -- the same action
// `renderListScreen`/`renderSingularScreen` themselves already check via
// `canRun` before fetching anything. Used only to decide whether this
// screen's *nav entry* should render at all for the current identity;
// the real, server-side enforcement (`serve.rs`) is unaffected either
// way -- this is a nav-visibility convenience, not a security boundary,
// same disclosed nature as every other client-side `canRun` gate.
function screenReadGate(screen) {
  return screen.actions.find((a) => a.kind === "list") || screen.actions.find((a) => a.kind === "get") || screen.actions.find((a) => a.kind === "update");
}

// Primary/secondary nav: screens sharing a `module` (`module "Name" {
// ... }`, LANGUAGE.md SS12) group under one collapsible header, in
// first-seen order; a screen with no `module` tag renders flat, exactly
// as every screen did before `module` existed. Only the group holding
// the *current* screen defaults expanded -- recomputed on every call
// (including on every navigation, see the `hashchange` listener below),
// so it always reflects wherever the user actually is; a manual toggle
// (click) persists only until the next navigation, not saved state.
// No identity at all -> no menu at all, not even Dashboard: the nav
// rail stays empty and `route()` (below) forces every hash to `#/login`
// until a sign-in succeeds. This is a UX gate, same disclosed nature as
// every other client-side check here (`canRun` etc.) -- the real
// security boundary is still `serve.rs`'s independent server-side
// `requires(...)` enforcement, unchanged by this; a screen with no
// `requires` on its read action was always a real, intentionally public
// read per this app's own governance model (the doc's "view X = none"
// rows), this just stops the *client* from previewing that data pre-
// login rather than gating access to it that wasn't gated to begin with.
function renderNav() {
  const nav = document.getElementById("nav");
  nav.textContent = "";
  const id = getIdentity();

  if (id) {
    if (HAS_DASHBOARD) nav.appendChild(navButton("dashboard", "Dashboard"));
    // "Workflows" -- one nav entry per declared `workflow`
    // (`WORKFLOW.md`'s "state ownership + a generated queue UI" section),
    // always shown to any signed-in identity (a workflow's own states
    // decide, per row, who actually sees anything once the queue loads
    // -- `canRun`-style nav-visibility gating doesn't apply here, there's
    // no single static role to check).
    for (const wf of WORKFLOWS) nav.appendChild(navButton("wf/" + wf.snake, wf.title));

    const currentHash = (location.hash || "").replace(/^#\//, "");
    const groups = [];
    for (const screen of MANIFEST) {
      const gate = screenReadGate(screen);
      if (gate && !canRun(gate)) continue; // role-based nav visibility
      let group = groups.find((g) => g.module === screen.module);
      if (!group) { group = { module: screen.module, screens: [] }; groups.push(group); }
      group.screens.push(screen);
    }
    for (const group of groups) {
      if (group.module == null) {
        for (const screen of group.screens) nav.appendChild(navButton(screen.snake, screen.title));
        continue;
      }
      const isActive = group.screens.some((s) => s.snake === currentHash);
      const body = el("div", { style: isActive ? "" : "display:none;" }, group.screens.map((s) => navButton(s.snake, s.title, true)));
      const chevron = () => (body.style.display === "none" ? "▶ " : "▼ ");
      const header = el("button", { class: "nav-item", text: chevron() + group.module });
      header.addEventListener("click", () => {
        body.style.display = body.style.display === "none" ? "" : "none";
        header.textContent = chevron() + group.module;
      });
      nav.appendChild(header);
      nav.appendChild(body);
    }
  }

  const slot = document.getElementById("identity-slot");
  slot.textContent = "";
  if (id) {
    slot.appendChild(el("span", { text: `Signed in as ${id.subject} `, style: "font-size:13px;color:var(--md-on-surface-variant);margin-right:8px;" }));
    slot.appendChild(el("button", { class: "btn btn-text", text: "Sign out", onclick: () => { clearIdentity(); renderNav(); route(); } }));
  } else {
    slot.appendChild(el("button", { class: "btn btn-outlined", text: "Sign in", onclick: () => { location.hash = "#/login"; } }));
  }
}

function route() {
  const hash = (location.hash || "").replace(/^#\//, "");
  document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n.dataset.route === hash));
  if (!getIdentity() && hash !== "login") { location.hash = "#/login"; return; }
  if (hash === "login") { renderLogin(); return; }
  if (hash === "dashboard") { renderDashboard(); return; }
  if (hash.startsWith("wf/")) {
    const wf = WORKFLOWS.find((w) => w.snake === hash.slice(3));
    if (wf) { renderWorkflowScreen(wf); return; }
  }
  const screen = MANIFEST.find((s) => s.snake === hash) || MANIFEST[0];
  if (!hash && HAS_DASHBOARD) { location.hash = "#/dashboard"; return; }
  if (!hash && !screen && WORKFLOWS.length) { location.hash = "#/wf/" + WORKFLOWS[0].snake; return; }
  if (!screen) {
    if (!HAS_DASHBOARD && !WORKFLOWS.length) {
      document.getElementById("content").appendChild(el("div", { class: "empty-state",
        text: "No screens derived -- add list_/create_/update_/delete_/get_ or stat_/chart_ functions to generate one." }));
    }
    return;
  }
  if (!hash) location.hash = "#/" + screen.snake;
  else renderScreen(screen);
}

// `renderNav`, not just `route`, on every navigation -- module-grouped
// nav (above) recomputes "which group is active" from the current hash,
// so it needs to re-run on every hash change too, not just at login/
// logout/initial load.
window.addEventListener("hashchange", () => { renderNav(); route(); });
renderNav();
route();
</script>
</body>
</html>

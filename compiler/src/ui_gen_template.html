// `#/ws/<snake>/<id>` -- the composed workspace itself
// (`examples/ctms/UI_CONSTRUCTS.md` §1, `ROADMAP.md` Track E1): a
// read-only header built from `ws.subjectGetFn(id)` (via the exact same
// `buildFieldControl` field->control mapping every other screen uses,
// inputs disabled post-hoc since this call passes `isEdit: false`, not a
// dedicated read-only mode) plus one `.card` per panel, each fetched and
// rendered independently by `renderPanel` below.
async function renderWorkspace(ws, id) {
  const content = document.getElementById("content");
  content.textContent = "";
  replayAnimation(content, "screen-enter");
  content.appendChild(el("h1", { class: "screen-title", text: ws.title }));
  content.appendChild(el("p", { class: "screen-sub", text: `${ws.subject} #${id}` }));

  let subjectRow = null;
  if (ws.subjectGetFn) {
    subjectRow = await callFn(ws.subjectGetFn, { [ws.subjectGetParam]: Number(id) });
    if (subjectRow) {
      const headerFields = ws.subjectFields.filter(canViewField);
      const header = el("div", { class: "card" }, headerFields.map((f) => {
        const c = buildFieldControl(f, subjectRow[f.name], false, true);
        c.el.querySelectorAll("input,select,textarea").forEach((i) => i.setAttribute("disabled", ""));
        return c.el;
      }));
      content.appendChild(header);
    }
  }

  for (const panel of ws.panels) {
    const card = el("section", { class: "card" }, []);
    card.appendChild(el("h2", { class: "screen-sub", text: panel.title }));
    content.appendChild(card);
    renderPanel(panel, card, id);
  }
}

// One panel's own composed section: fetches `panel.sourceFn` with the
// workspace subject's `id` as its one argument, renders whatever comes
// back as a plain table (columns inferred from the first row's own
// keys -- a panel's `source` fn shapes its own output, there's no
// declared `FieldSpec` list to render from the way a screen's own
// fields are), then each declared panel `action` as a button below.
//
// Convention (undesigned in depth -- `examples/ctms/UI_CONSTRUCTS.md`
// §1's "Panel refresh" open question): a panel action's *first*
// parameter is always treated as "this workspace instance's own id" --
// pre-filled from `id` and never rendered as an input, the same
// "sole id param, hidden" treatment a screen's own delete/custom row
// actions already give their id param (`renderListScreen`'s
// `deleteAction`/`customActions` handling above) -- every remaining
// parameter renders as an ordinary form field. A successful action
// reloads just this panel, not the whole workspace.
async function renderPanel(panel, container, id) {
  const body = el("div", { class: "table-scroll" }, [el("div", { class: "empty-state", text: "Loading…" })]);
  container.appendChild(body);

  async function reload() {
    body.textContent = "";
    if (panel.sourceRequiresLogin && !getIdentity()) {
      body.appendChild(el("div", { class: "empty-state", text: "Sign in to view this." }));
      return;
    }
    const result = await callFn(panel.sourceFn, { [panel.sourceParam]: Number(id) });

    // Track E2: a panel's `render: "..."` (default "table", unchanged
    // behavior) reuses the exact same render functions `renderDashboard`
    // uses for a `visual` item -- both just hand one of these whatever
    // JS value the backing fn already resolved to.
    if (panel.render === "graph") {
      const nodes = result && Array.isArray(result.nodes) ? result.nodes : [];
      if (nodes.length === 0) { body.appendChild(el("div", { class: "empty-state", text: "Nothing here yet." })); return; }
      body.appendChild(renderForceGraph(result));
      return;
    }
    const list = Array.isArray(result) ? result : (result && typeof result === "object" ? [result] : []);
    if (list.length === 0) {
      body.appendChild(el("div", { class: "empty-state", text: "Nothing here yet." }));
      return;
    }
    if (panel.render === "heatmap") { body.appendChild(renderHeatGrid(list)); return; }
    if (panel.render === "timeline") { body.appendChild(renderTimelineList(list)); return; }
    const cols = Object.keys(list[0]);
    const table = el("table", {}, [el("thead", {}, [el("tr", {}, cols.map((c) => el("th", { text: c })))])]);
    const tbody = el("tbody", {}, []);
    let rowIndex = 0;
    for (const row of list) {
      tbody.appendChild(el(
        "tr",
        { class: "row-enter", style: `animation-delay: calc(var(--stagger-ms) * ${rowIndex} * 1ms)` },
        cols.map((c) => el("td", { text: row[c] !== null && row[c] !== undefined ? String(row[c]) : "" })),
      ));
      rowIndex++;
    }
    table.appendChild(tbody);
    body.appendChild(el("div", { class: "table-scroll" }, [table]));
  }
  await reload();

  for (const action of panel.actions) {
    const btn = el("button", { class: action.style === "filled" ? "btn btn-filled" : "btn btn-outlined", text: action.label || action.fn }, []);
    if (!canRun(action)) btn.setAttribute("disabled", "");
    let formEl = null;
    btn.addEventListener("click", () => {
      if (formEl) { formEl.remove(); formEl = null; return; }
      const idParam = action.params[0];
      const idValues = idParam ? { [idParam.name]: Number(id) } : {};
      const restParams = idParam ? action.params.slice(1) : action.params;
      formEl = buildForm(
        restParams, null,
        async (vals) => {
          if (action.confirm && !window.confirm(action.confirm)) return;
          const r = await callFn(action.fn, { ...idValues, ...vals });
          if (r !== null) {
            showSnackbar(`${action.label || action.fn} done.`);
            if (action.showResult) showResultModal(action.label || action.fn, r);
            formEl.remove(); formEl = null;
            await reload();
          }
        },
        action.label || "Submit", !canRun(action), gateReason(action),
      );
      container.appendChild(formEl);
    });
    container.appendChild(btn);
  }
}

// ---- login (stub) screen ----
// Called right after a successful sign-in. `route()` alone would just
// re-render the login screen again -- the hash is still `#/login` at
// that point, and `route()` reads the hash, not "did we just log in" --
// so a successful sign-in used to leave the user staring at the sign-in
// form a second time instead of landing in the app. Navigate to the
// dashboard (or the first screen the newly-signed-in identity can
// actually see, honoring the same role-based nav visibility `renderNav`
// itself applies) whenever sign-in happened *from* the login screen;
// leave the hash alone if sign-in happened via the nav-rail "Sign in"
// while already looking at a screen (rare, but don't yank them away).
function postLoginRedirect() {
  renderNav();
  const hash = (location.hash || "").replace(/^#\//, "");
  if (hash !== "login" && hash !== "") { route(); return; }
  if (HAS_DASHBOARD) {
    location.hash = "#/dashboard";
  } else {
    const first = MANIFEST.find((s) => { const gate = screenReadGate(s); return !gate || canRun(gate); });
    if (first) location.hash = "#/" + first.snake;
  }
  route();
}

// ---- demo mode's "pick a persona" avatars ----
// A small fixed palette, indexed by a cheap hash of the name -- same
// avatar every time for the same role/claim, no images/assets needed.
// 2026-09-03: replaced the generic Material-You default swatch (no
// relationship to this brand) with one built from the logo's own
// family -- the first two are the navy itself and one step up its tint
// ramp (`--md-primary`/`--md-primary-container`'s neighborhood), the
// next two are deep ochre/rust variants on the *same* ~34° hue as
// `--brand-accent` darkened for a fill role instead of a thin-accent
// one, and the remaining four are jewel-tone siblings at matching
// depth/saturation that bridge the warm amber and cool navy so an
// 8-color set doesn't collapse into "navy and orange, repeated." Every
// entry clears 4.5:1 against the avatar's own white initials text.
const DEMO_AVATAR_COLORS = ["#1f1a52", "#382f7a", "#8b5104", "#a0430c", "#1f6f64", "#6b2158", "#386a20", "#31628d"];
function demoAvatarColorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return DEMO_AVATAR_COLORS[hash % DEMO_AVATAR_COLORS.length];
}
function demoAvatarInitials(name) {
  const parts = name.replace(/[_-]/g, " ").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function demoAvatarCard(label, sublabel, onClick) {
  const avatar = el("div", { class: "demo-avatar", style: `background:${demoAvatarColorFor(label)}`, text: demoAvatarInitials(label) });
  return el("button", { type: "button", class: "demo-avatar-card", onclick: onClick }, [
    avatar,
    el("div", { class: "demo-avatar-label", text: label }),
    sublabel ? el("div", { class: "demo-avatar-sublabel", text: sublabel }) : null,
  ]);
}

function renderLogin() {
  const content = document.getElementById("content");
  content.textContent = "";
  content.appendChild(el("h1", { class: "screen-title", text: "Sign in" }));
  const subject = el("input", { type: "text", value: "" });
  const roles = el("input", { type: "text", value: "" });

  if (IDENTITY_BASE) {
    content.appendChild(el("div", { class: "stub-note",
      text: `Signs in against a mock identity server at ${IDENTITY_BASE} (examples/identity_mock.nir) -- a real signed token, verified independently by this app's own server on every call, but the identity server itself is a mock, not a real IdP.` }));
    const form = el("form", { class: "card", onsubmit: async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(`${IDENTITY_BASE}/api/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject: { value: subject.value || "user" }, role: roles.value }),
        });
        const body = await res.json();
        // `login`'s declared return is `Result(Text, Text)` (the str-ban's
        // wrapper struct), so a real `Err(Text)`/`Ok(Text)` payload is
        // `{value: "..."}`, not a bare string -- but a decode-level failure
        // (e.g. a malformed request body) is `serve.rs`'s own plain-string
        // `err`, not this fn's declared type. Unwrap `.value` when present,
        // fall back to the raw value otherwise, so both shapes render/work.
        const textValue = (x) => (x && typeof x === "object" && "value" in x) ? x.value : x;
        if (body && body.err) { showSnackbar(String(textValue(body.err)), true); return; }
        const token = textValue(body.ok);
        const claims = decodeJwtPayload(token);
        setIdentity({ subject: claims.sub || subject.value, roles: claims.roles || [], claims, token });
        showSnackbar("Signed in.");
        postLoginRedirect();
      } catch (err) { showSnackbar(`login: ${err.message}`, true); }
    }}, [
      el("div", { class: "field" }, [el("label", { text: "subject" }), subject]),
      el("div", { class: "field" }, [el("label", { text: "role (whatever your identity server recognizes)" }), roles]),
      el("button", { type: "submit", class: "btn btn-filled", text: "Sign in" }),
    ]);
    content.appendChild(form);
    return;
  }

  // Production mode: `--oidc-*` flags are configured (which itself
  // requires the real `--jwks-file`/`--issuer`/`--audience` trio) --
  // hand off entirely to the identity provider's own hosted login, a
  // real OIDC Authorization Code + PKCE redirect (`serve.rs`'s `GET
  // /auth/login`/`GET /auth/callback`). No form, no fetch here -- just
  // a full-page navigation; the round trip lands back on `#/auth/callback`
  // (see the bootstrap snippet near `route()`, below).
  if (PRODUCTION_MODE) {
    content.appendChild(el("div", { class: "stub-note", text: "Sign in with your organization's identity provider." }));
    content.appendChild(el("button", { type: "button", class: "btn btn-filled", text: "Sign in with SSO", onclick: () => { location.href = "/auth/login"; } }));
    return;
  }

  // Demo mode: no real `--jwks-file`/`--issuer`/`--audience` configured
  // -- one avatar per role/claim `IDENTITY_CATALOG` found anywhere in
  // this program, each a one-click sign-in as that persona. Unlike the
  // old free-text stub below, this actually POSTs to `/api/_demo_login`
  // and gets back a real, server-verified token (`serve.rs::
  // AuthConfig::demo()`'s ephemeral per-process secret), so a
  // `requires(role: ...)`-gated action genuinely runs, not just previews.
  if (DEMO_MODE) {
    content.appendChild(el("div", { class: "stub-note",
      text: "Demo mode: pick a role below to sign in as it. This mints a real, server-verified token (ephemeral to this running server, never a stand-in for a real identity provider) -- run with real --jwks-file/--issuer/--audience for production sign-in." }));

    async function signInAs(subjectValue, roleList, claimPairs) {
      try {
        const res = await fetch(`${API_BASE}/_demo_login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject: subjectValue, roles: roleList, claims: claimPairs }),
        });
        const body = await res.json();
        if (body && body.err) { showSnackbar(String(body.err), true); return; }
        const token = body.token;
        const claims = decodeJwtPayload(token);
        setIdentity({ subject: subjectValue, roles: roleList, claims, token });
        showSnackbar("Signed in.");
        postLoginRedirect();
      } catch (err) { showSnackbar(`login: ${err.message}`, true); }
    }

    const grid = el("div", { class: "demo-avatar-grid" }, []);
    for (const role of IDENTITY_CATALOG.roles) {
      grid.appendChild(demoAvatarCard(role, "role", () => signInAs(role, [role], {})));
    }
    for (const c of IDENTITY_CATALOG.claims) {
      grid.appendChild(demoAvatarCard(`${c.key}=${c.value}`, "claim", () => signInAs(c.key, [], { [c.key]: c.value })));
    }
    if (IDENTITY_CATALOG.roles.length === 0 && IDENTITY_CATALOG.claims.length === 0) {
      grid.appendChild(demoAvatarCard("guest", "no roles/claims declared", () => signInAs("guest", [], {})));
    }
    content.appendChild(grid);

    // Advanced: a custom subject, or more than one role/claim at once --
    // anything the one-click persona grid above doesn't cover.
    const claims = el("input", { type: "text", value: "" });
    const details = el("details", { class: "demo-advanced" }, [
      el("summary", { text: "Advanced: custom subject/roles/claims" }),
      el("form", { class: "card", onsubmit: (e) => {
        e.preventDefault();
        const claimPairs = {};
        for (const part of claims.value.split(",")) {
          const [k, v] = part.split("=").map((s) => (s || "").trim());
          if (k) claimPairs[k] = v || "";
        }
        signInAs(subject.value || "demo", roles.value.split(",").map((s) => s.trim()).filter(Boolean), claimPairs);
      }}, [
        el("div", { class: "field" }, [el("label", { text: "subject" }), subject]),
        el("div", { class: "field" }, [el("label", { text: "roles (comma-separated) — known: " + (IDENTITY_CATALOG.roles.join(", ") || "none") }), roles]),
        el("div", { class: "field" }, [el("label", { text: "claims (key=value, comma-separated) — known: " + (IDENTITY_CATALOG.claims.map((c) => `${c.key}=${c.value}`).join(", ") || "none") }), claims]),
        el("button", { type: "submit", class: "btn btn-filled", text: "Sign in" }),
      ]),
    ]);
    content.appendChild(details);
    return;
  }

  // Neither mode -- `nirdosha emit-ui`'s static-file output, no server
  // behind either `/api/_demo_login` or `/auth/login`. Original pure
  // client-side stub, unchanged: stores a mock identity in this browser
  // only, no token sent anywhere.
  content.appendChild(el("div", { class: "stub-note",
    text: "Generated stub: stores a mock identity in this browser only, no token sent anywhere -- a requires(role: ...)-gated action cannot actually pass the server's check this way. Run with `nirdosha serve --identity-base <url>` for a real (mock) sign-in." }));
  const claims = el("input", { type: "text", value: "" });
  const form = el("form", { class: "card", onsubmit: (e) => {
    e.preventDefault();
    const claimPairs = {};
    for (const part of claims.value.split(",")) {
      const [k, v] = part.split("=").map((s) => (s || "").trim());
      if (k) claimPairs[k] = v || "";
    }
    setIdentity({ subject: subject.value || "user", roles: roles.value.split(",").map((s) => s.trim()).filter(Boolean), claims: claimPairs });
    showSnackbar("Signed in.");
    postLoginRedirect();
  }}, [
    el("div", { class: "field" }, [el("label", { text: "subject" }), subject]),
    el("div", { class: "field" }, [el("label", { text: "roles (comma-separated)" }), roles]),
    el("div", { class: "field" }, [el("label", { text: "claims (key=value, comma-separated)" }), claims]),
    el("button", { type: "submit", class: "btn btn-filled", text: "Sign in" }),
  ]);
  content.appendChild(form);
}

// ---- nav + routing ----
const HAS_DASHBOARD = STATS.length > 0 || CHARTS.length > 0;

function navButton(route, label, secondary) {
  return el("button", { class: secondary ? "nav-item nav-item-secondary" : "nav-item", text: label, "data-route": route, onclick: () => { location.hash = "#/" + route; } }, []);
}

// A screen's own read gate -- `list` for a table screen, else `get`,
// else `update` for a singular one (`is_singular`'s own definition:
// no `list`, but a `get` or `update` exists) -- the same action
// `renderListScreen`/`renderSingularScreen` themselves already check via
// `canRun` before fetching anything. Used only to decide whether this
// screen's *nav entry* should render at all for the current identity;
// the real, server-side enforcement (`serve.rs`) is unaffected either
// way -- this is a nav-visibility convenience, not a security boundary,
// same disclosed nature as every other client-side `canRun` gate.
function screenReadGate(screen) {
  return screen.actions.find((a) => a.kind === "list") || screen.actions.find((a) => a.kind === "get") || screen.actions.find((a) => a.kind === "update");
}

// Primary/secondary nav: screens sharing a `module` (`module "Name" {
// ... }`, LANGUAGE.md SS12) group under one collapsible header, in
// first-seen order; a screen with no `module` tag renders flat, exactly
// as every screen did before `module` existed. Only the group holding
// the *current* screen defaults expanded -- recomputed on every call
// (including on every navigation, see the `hashchange` listener below),
// so it always reflects wherever the user actually is; a manual toggle
// (click) persists only until the next navigation, not saved state.
// No identity at all -> no menu at all, not even Dashboard: the nav
// rail stays empty and `route()` (below) forces every hash to `#/login`
// until a sign-in succeeds. This is a UX gate, same disclosed nature as
// every other client-side check here (`canRun` etc.) -- the real
// security boundary is still `serve.rs`'s independent server-side
// `requires(...)` enforcement, unchanged by this; a screen with no
// `requires` on its read action was always a real, intentionally public
// read per this app's own governance model (the doc's "view X = none"
// rows), this just stops the *client* from previewing that data pre-
// login rather than gating access to it that wasn't gated to begin with.
function renderNav() {
  const nav = document.getElementById("nav");
  nav.textContent = "";
  const id = getIdentity();

  if (id) {
    if (HAS_DASHBOARD) nav.appendChild(navButton("dashboard", "Dashboard"));
    // "Workflows" -- one nav entry per declared `workflow`
    // (`WORKFLOW.md`'s "state ownership + a generated queue UI" section),
    // always shown to any signed-in identity (a workflow's own states
    // decide, per row, who actually sees anything once the queue loads
    // -- `canRun`-style nav-visibility gating doesn't apply here, there's
    // no single static role to check).
    for (const wf of WORKFLOWS) nav.appendChild(navButton("wf/" + wf.snake, wf.title));
    // "Workspaces" -- one nav entry per declared `workspace`, same
    // always-shown-to-any-signed-in-identity treatment as `WORKFLOWS`
    // above (a workspace's own panels are each independently gated
    // server-side; there's no single static role to nav-gate on here
    // either). Points at the picker (`renderWorkspaceList`,
    // `#/ws/<snake>`), not a specific instance -- an instance is only
    // reachable from there, or from the subject screen's own "Open
    // Workspace" row button (`renderListScreen`).
    for (const ws of WORKSPACES) nav.appendChild(navButton("ws/" + ws.snake, ws.title));

    const currentHash = (location.hash || "").replace(/^#\//, "");
    const groups = [];
    for (const screen of MANIFEST) {
      const gate = screenReadGate(screen);
      if (gate && !canRun(gate)) continue; // role-based nav visibility
      let group = groups.find((g) => g.module === screen.module);
      if (!group) { group = { module: screen.module, screens: [] }; groups.push(group); }
      group.screens.push(screen);
    }
    for (const group of groups) {
      if (group.module == null) {
        for (const screen of group.screens) nav.appendChild(navButton(screen.snake, screen.title));
        continue;
      }
      const isActive = group.screens.some((s) => s.snake === currentHash);
      const body = el("div", { style: isActive ? "" : "display:none;" }, group.screens.map((s) => navButton(s.snake, s.title, true)));
      const chevron = () => (body.style.display === "none" ? "▶ " : "▼ ");
      const header = el("button", { class: "nav-item", text: chevron() + group.module });
      header.addEventListener("click", () => {
        body.style.display = body.style.display === "none" ? "" : "none";
        header.textContent = chevron() + group.module;
      });
      nav.appendChild(header);
      nav.appendChild(body);
    }
  }

  const slot = document.getElementById("identity-slot");
  slot.textContent = "";
  if (id) {
    slot.appendChild(el("span", { text: `Signed in as ${id.subject} `, style: "font-size:13px;color:var(--md-on-surface-variant);margin-right:8px;" }));
    slot.appendChild(el("button", { class: "btn btn-text", text: "Sign out", onclick: () => { clearIdentity(); renderNav(); route(); } }));
  } else {
    slot.appendChild(el("button", { class: "btn btn-outlined", text: "Sign in", onclick: () => { location.hash = "#/login"; } }));
  }
}

function route() {
  const hash = (location.hash || "").replace(/^#\//, "");
  // Production mode's OIDC redirect lands back here from `serve.rs`'s
  // `GET /auth/callback` (`/#/auth/callback?token=...`) -- this is the
  // one piece of hash-query parsing this template does anywhere, and it
  // has to run before the `!getIdentity()` guard below, or an
  // unauthenticated visitor mid-redirect would get bounced to `#/login`
  // before ever storing the token that redirect carries.
  if (hash.startsWith("auth/callback")) {
    const qIndex = hash.indexOf("?");
    const params = new URLSearchParams(qIndex >= 0 ? hash.slice(qIndex + 1) : "");
    const token = params.get("token");
    if (token) {
      const claims = decodeJwtPayload(token);
      setIdentity({ subject: claims.sub, roles: claims.roles || [], claims, token });
    }
    location.hash = "#/dashboard";
    return;
  }
  document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n.dataset.route === hash));
  if (!getIdentity() && hash !== "login") { location.hash = "#/login"; return; }
  if (hash === "login") { renderLogin(); return; }
  if (hash === "dashboard") { renderDashboard(); return; }
  if (hash.startsWith("wf/")) {
    const wf = WORKFLOWS.find((w) => w.snake === hash.slice(3));
    if (wf) { renderWorkflowScreen(wf); return; }
  }
  if (hash.startsWith("ws/")) {
    const rest = hash.slice(3);
    const slash = rest.indexOf("/");
    const wsSnake = slash >= 0 ? rest.slice(0, slash) : rest;
    const ws = WORKSPACES.find((w) => w.snake === wsSnake);
    if (ws) {
      if (slash >= 0) renderWorkspace(ws, rest.slice(slash + 1));
      else renderWorkspaceList(ws);
      return;
    }
  }
  const screen = MANIFEST.find((s) => s.snake === hash) || MANIFEST[0];
  if (!hash && HAS_DASHBOARD) { location.hash = "#/dashboard"; return; }
  if (!hash && !screen && WORKFLOWS.length) { location.hash = "#/wf/" + WORKFLOWS[0].snake; return; }
  if (!screen) {
    if (!HAS_DASHBOARD && !WORKFLOWS.length) {
      document.getElementById("content").appendChild(el("div", { class: "empty-state",
        text: "No screens derived -- add list_/create_/update_/delete_/get_ or stat_/chart_ functions to generate one." }));
    }
    return;
  }
  if (!hash) location.hash = "#/" + screen.snake;
  else renderScreen(screen);
}

// `renderNav`, not just `route`, on every navigation -- module-grouped
// nav (above) recomputes "which group is active" from the current hash,
// so it needs to re-run on every hash change too, not just at login/
// logout/initial load.
window.addEventListener("hashchange", () => { renderNav(); route(); });

// A `localStorage`-cached identity from a *previous* run of this server
// can look signed-in while actually being dead: demo mode mints a
// fresh ephemeral signing key every process start (`AuthConfig::
// demo()`), so a token from before a restart no longer verifies here,
// even though the browser never forgot it. Confirm the cached identity
// (if any) is still valid against THIS process, via the same
// `resolve_identity` verification every other request goes through,
// before rendering anything as signed-in -- otherwise the nav/screens
// would render from stale client-side role/claim data that the server
// will then reject on the very first real action, a confusing dead end
// with no obvious cause. A network hiccup here doesn't sign the user
// out -- only an explicit rejection from the server does; the next real
// API call still enforces this for real either way.
async function validateStoredIdentityThenStart() {
  const id = getIdentity();
  if (id && id.token) {
    try {
      const res = await fetch(`${API_BASE}/_whoami`, { headers: { Authorization: `Bearer ${id.token}` } });
      if (!res.ok) clearIdentity();
    } catch (e) { /* transient failure -- leave the cached identity alone */ }
  }
  renderNav();
  route();
}
validateStoredIdentityThenStart();
</script>
</body>
</html>

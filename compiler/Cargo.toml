[package]
name = "nirdosha"
version = "0.1.0"
edition = "2024"

[dependencies]
z3 = "0.20.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
redis = "0.27"
tiny_http = "0.12"
